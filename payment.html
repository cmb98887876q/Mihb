<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #111827;
      padding: 20px;
    }

    .container {
      max-width: 550px;
      margin: 30px auto;
    }

    .header {
      margin-bottom: 20px;
    }

    .header h1 {
      color: #2563eb;
      margin-bottom: 8px;
    }

    .back {
      color: #2563eb;
      text-decoration: none;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
      margin-bottom: 15px;
    }

    .card h2 {
      margin-bottom: 18px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .total {
      border-top: 1px solid #ddd;
      padding-top: 15px;
      margin-top: 15px;
      font-size: 20px;
      font-weight: bold;
    }

    .payment-method {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .payment-method:has(input:checked) {
      border-color: #2563eb;
      background: #eff6ff;
    }

    .payment-method input {
      accent-color: #2563eb;
    }

    .pay-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      cursor: pointer;
      margin-top: 10px;
    }

    .pay-btn:hover {
      background: #1d4ed8;
    }

    .pay-btn:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .success {
      text-align: center;
      padding: 30px;
    }

    .success h2 {
      color: #16a34a;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">

    <h1>Payment</h1>

    <a
      href="cart.html"
      class="back"
    >
      ← Back to Cart
    </a>

  </div>


  <!-- Order Summary -->

  <div class="card">

    <h2>Order Summary</h2>

    <div id="orderItems">
      Loading...
    </div>

    <div class="summary-row total">

      <span>Total</span>

      <span id="totalPrice">
        ₹0
      </span>

    </div>

  </div>


  <!-- Payment -->

  <div
    class="card"
    id="paymentCard"
  >

    <h2>
      Choose Payment Method
    </h2>


    <label class="payment-method">

      <input
        type="radio"
        name="payment"
        value="UPI"
        checked
      >

      <span>
        📱 UPI
      </span>

    </label>


    <label class="payment-method">

      <input
        type="radio"
        name="payment"
        value="Card"
      >

      <span>
        💳 Card
      </span>

    </label>


    <label class="payment-method">

      <input
        type="radio"
        name="payment"
        value="Cash on Delivery"
      >

      <span>
        💵 Cash on Delivery
      </span>

    </label>


    <button
      class="pay-btn"
      id="payButton"
      onclick="createOrder()"
    >
      Place Order
    </button>

  </div>

</div>


<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

  import {
    getAuth,
    signInAnonymously
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

  import {
    getDatabase,
    ref,
    onValue,
    push,
    set,
    remove
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


  // Firebase config
  const configMovie = {

    apiKey:
      "AIzaSyCZQoxcRbowOLLjfRcV8c0vfiTLsfc2Gys",

    authDomain:
      "movie-2-f1b16.firebaseapp.com",

    databaseURL:
      "https://movie-2-f1b16-default-rtdb.firebaseio.com",

    projectId:
      "movie-2-f1b16"
  };


  const app =
    initializeApp(configMovie);

  const auth =
    getAuth(app);

  const database =
    getDatabase(app);


  const orderItems =
    document.getElementById(
      "orderItems"
    );

  const totalPrice =
    document.getElementById(
      "totalPrice"
    );

  const payButton =
    document.getElementById(
      "payButton"
    );


  let currentUser = null;

  let currentCart = {};

  let currentTotal = 0;


  async function start() {

    try {

      const result =
        await signInAnonymously(auth);

      currentUser =
        result.user;


      const cartRef =
        ref(
          database,
          "users/" +
          currentUser.uid +
          "/cart"
        );


      onValue(
        cartRef,
        snapshot => {

          currentCart =
            snapshot.val() || {};


          showCart();

        }
      );


    } catch(error) {

      console.error(error);

      orderItems.innerHTML = `
        <p>
          Firebase connection failed.
        </p>
      `;

      payButton.disabled = true;

    }

  }


  function showCart() {

    const items =
      Object.entries(currentCart);


    if (items.length === 0) {

      orderItems.innerHTML = `
        <p>
          Your cart is empty.
        </p>
      `;

      totalPrice.textContent =
        "₹0";

      payButton.disabled = true;

      return;

    }


    currentTotal = 0;


    let html = "";


    items.forEach(
      ([id, product]) => {

        const quantity =
          product.quantity || 1;


        const itemTotal =
          product.price *
          quantity;


        currentTotal +=
          itemTotal;


        html += `

          <div class="summary-row">

            <span>
              ${product.name}
              × ${quantity}
            </span>

            <span>
              ₹${itemTotal}
            </span>

          </div>

        `;

      }
    );


    orderItems.innerHTML =
      html;


    totalPrice.textContent =
      "₹" + currentTotal;


    payButton.disabled = false;

  }


  // Create Firebase order
  window.createOrder =
    async function() {

      if (!currentUser) {

        alert(
          "Please wait..."
        );

        return;

      }


      if (
        Object.keys(currentCart).length === 0
      ) {

        alert(
          "Your cart is empty."
        );

        return;

      }


      const selected =
        document.querySelector(
          'input[name="payment"]:checked'
        );


      if (!selected) {

        alert(
          "Please select a payment method."
        );

        return;

      }


      const paymentMethod =
        selected.value;


      payButton.disabled = true;

      payButton.textContent =
        "Creating Order...";


      try {

        // Order reference
        const ordersRef =
          ref(
            database,
            "users/" +
            currentUser.uid +
            "/orders"
          );


        const newOrder =
          push(ordersRef);


        await set(
          newOrder,
          {

            items: currentCart,

            total: currentTotal,

            paymentMethod:
              paymentMethod,

            paymentStatus:
              "pending",

            orderStatus:
              "pending",

            createdAt:
              Date.now()

          }
        );


        // Remove cart after order creation
        await remove(
          ref(
            database,
            "users/" +
            currentUser.uid +
            "/cart"
          )
        );


        document.getElementById(
          "paymentCard"
        ).innerHTML = `

          <div class="success">

            <h2>
              ✅ Order Created
            </h2>

            <p>
              Your order has been saved.
            </p>

            <br>

            <p>
              Payment:
              ${paymentMethod}
            </p>

            <br>

            <p>
              Amount:
              ₹${currentTotal}
            </p>

            <br>

            <button
              class="pay-btn"
              onclick="goHome()"
            >
              Continue Shopping
            </button>

          </div>

        `;


      } catch(error) {

        console.error(error);

        alert(
          "Could not create order."
        );

        payButton.disabled =
          false;

        payButton.textContent =
          "Place Order";

      }

    };


  window.goHome =
    function() {

      window.location.href =
        "product.html";

    };


  start();

</script>

</body>
</html>
