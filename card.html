<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Cart</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #111827;
      padding: 20px;
    }

    header {
      max-width: 800px;
      margin: auto;
      margin-bottom: 25px;
    }

    header h1 {
      color: #2563eb;
      margin-bottom: 10px;
    }

    .back {
      color: #2563eb;
      text-decoration: none;
    }

    .cart {
      max-width: 800px;
      margin: auto;
    }

    .cart-item {
      background: white;
      padding: 15px;
      border-radius: 15px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    .cart-item img {
      width: 100px;
      height: 80px;
      object-fit: cover;
      border-radius: 10px;
    }

    .info {
      flex: 1;
    }

    .info h2 {
      font-size: 18px;
      margin-bottom: 8px;
    }

    .price {
      color: #2563eb;
      font-weight: bold;
    }

    .remove {
      background: #ef4444;
      color: white;
      border: none;
      padding: 9px 13px;
      border-radius: 7px;
      cursor: pointer;
    }

    .remove:hover {
      background: #dc2626;
    }

    .total {
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-top: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
      text-align: right;
    }

    .total h2 {
      margin-bottom: 15px;
    }

    .checkout {
      background: #2563eb;
      color: white;
      border: none;
      padding: 13px 25px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .empty {
      background: white;
      padding: 40px 20px;
      border-radius: 15px;
      text-align: center;
    }

    @media(max-width:500px) {

      .cart-item {
        flex-wrap: wrap;
      }

      .cart-item img {
        width: 80px;
        height: 70px;
      }

      .remove {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header>

  <h1>My Cart 🛒</h1>

  <a href="product.html" class="back">
    ← Continue Shopping
  </a>

</header>


<div
  class="cart"
  id="cartContainer"
>
  Loading...
</div>


<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

  import {
    getAuth,
    signInAnonymously
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

  import {
    getDatabase,
    ref,
    onValue,
    remove
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


  // Firebase config
  const configMovie = {

    apiKey:
      "AIzaSyCZQoxcRbowOLLjfRcV8c0vfiTLsfc2Gys",

    authDomain:
      "movie-2-f1b16.firebaseapp.com",

    databaseURL:
      "https://movie-2-f1b16-default-rtdb.firebaseio.com",

    projectId:
      "movie-2-f1b16"
  };


  const app =
    initializeApp(configMovie);

  const auth =
    getAuth(app);

  const database =
    getDatabase(app);


  const cartContainer =
    document.getElementById(
      "cartContainer"
    );


  async function start() {

    try {

      const result =
        await signInAnonymously(auth);

      const user =
        result.user;


      const cartRef =
        ref(
          database,
          "users/" +
          user.uid +
          "/cart"
        );


      // Real-time Firebase listener
      onValue(
        cartRef,
        snapshot => {

          const data =
            snapshot.val();


          if (!data) {

            cartContainer.innerHTML = `

              <div class="empty">

                <h2>
                  Your cart is empty 🛒
                </h2>

                <br>

                <a href="product.html">
                  Go to Products
                </a>

              </div>

            `;

            return;

          }


          let total = 0;

          let html = "";


          Object.entries(data)
            .forEach(
              ([id, product]) => {

                const quantity =
                  product.quantity || 1;


                const itemTotal =
                  product.price *
                  quantity;


                total += itemTotal;


                html += `

                  <div class="cart-item">

                    <img
                      src="${product.image}"
                      alt="${product.name}"
                    >

                    <div class="info">

                      <h2>
                        ${product.name}
                      </h2>

                      <p class="price">
                        ₹${product.price}
                        × ${quantity}
                      </p>

                    </div>

                    <button
                      class="remove"
                      onclick="removeProduct('${id}')"
                    >
                      Remove
                    </button>

                  </div>

                `;

              }
            );


          html += `

            <div class="total">

              <h2>
                Total: ₹${total}
              </h2>

              <button
                class="checkout"
                onclick="goToPayment()"
              >
                Checkout
              </button>

            </div>

          `;


          cartContainer.innerHTML =
            html;

        }
      );


      // Make functions available
      window.removeProduct =
        async function(id) {

          try {

            await remove(
              ref(
                database,
                "users/" +
                user.uid +
                "/cart/" +
                id
              )
            );

          } catch(error) {

            console.error(error);

            alert(
              "Could not remove product."
            );

          }

        };


      window.goToPayment =
        function() {

          window.location.href =
            "payment.html";

        };


    } catch(error) {

      console.error(error);

      cartContainer.innerHTML = `

        <div class="empty">

          <h2>
            Firebase connection failed
          </h2>

          <p>
            Check Firebase Authentication.
          </p>

        </div>

      `;

    }

  }


  start();

</script>

</body>
</html>
