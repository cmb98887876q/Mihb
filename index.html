<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Sequence - YouTube Ready</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  body {
    background: #0a0a0a;
    color: #fff;
    min-height: 100vh;
    padding: 30px 15px 60px;
  }

  .container {
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
  }

  h1 {
    text-align: center;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 6px;
  }

  .subtitle {
    text-align: center;
    color: #aaa;
    font-size: 14px;
    margin-bottom: 28px;
  }

  /* ========== IMAGE CARDS ========== */
  .image-card {
    background: #141414;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 18px;
    border: 1px solid #2a2a2a;
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .card-title {
    font-size: 15px;
    font-weight: 600;
    color: #ddd;
  }

  .remove-btn {
    background: #333;
    border: none;
    color: #ff6b6b;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .remove-btn:hover {
    background: #444;
  }

  .upload-box {
    background: #1a1a1a;
    border: 2px dashed #444;
    border-radius: 12px;
    height: 150px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: border-color 0.3s;
  }

  .upload-box:hover,
  .upload-box.dragover {
    border-color: #777;
  }

  .upload-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    position: absolute;
    top: 0;
    left: 0;
  }

  .upload-label {
    text-align: center;
    z-index: 1;
    pointer-events: none;
  }

  .upload-label .title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .upload-label .hint {
    font-size: 13px;
    color: #888;
  }

  .name-input {
    width: 100%;
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 11px 14px;
    color: #fff;
    font-size: 14px;
    outline: none;
    margin-top: 12px;
  }

  .name-input:focus {
    border-color: #666;
  }

  /* ========== CONTROLS ========== */
  .controls {
    background: #141414;
    border-radius: 14px;
    padding: 20px;
    margin-top: 10px;
    border: 1px solid #2a2a2a;
  }

  .duration-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-size: 14px;
    color: #ccc;
  }

  .duration-value {
    font-weight: 600;
    color: #fff;
  }

  input[type="range"] {
    width: 100%;
    height: 6px;
    -webkit-appearance: none;
    background: #333;
    border-radius: 3px;
    outline: none;
    margin-bottom: 22px;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    background: #fff;
    border-radius: 50%;
    cursor: pointer;
  }

  .btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 11px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s, opacity 0.15s;
    margin-bottom: 10px;
  }

  .btn:active {
    transform: scale(0.98);
  }

  .btn-add {
    background: #2a2a2a;
    color: #fff;
    border: 1px dashed #555;
  }

  .btn-add:hover {
    background: #333;
  }

  .btn-start {
    background: #fff;
    color: #000;
  }

  .btn-start:hover {
    opacity: 0.92;
  }

  .btn-reset {
    background: #333;
    color: #fff;
    margin-bottom: 0;
  }

  .btn-reset:hover {
    background: #444;
  }

  /* ========== ANIMATION OVERLAY (YouTube 16:9) ========== */
  #animationOverlay {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 9999;
    display: none;
    justify-content: center;
    align-items: center;
  }

  #animationOverlay.active {
    display: flex;
  }

  /* Pure 16:9 YouTube frame */
  .yt-frame {
    position: relative;
    width: 100%;
    max-width: 1280px;
    aspect-ratio: 16 / 9;
    background: #000;
    overflow: hidden;
  }

  .anim-number {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: clamp(90px, 18vw, 180px);
    font-weight: 800;
    color: #fff;
    opacity: 0;
    transform: scale(0.35);
    transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    z-index: 5;
  }

  .anim-number.show {
    opacity: 1;
    transform: scale(1);
  }

  .anim-image-box {
    position: absolute;
    inset: 0;
    opacity: 0;
    transform: scale(1.03);
    transition: all 0.65s ease;
  }

  .anim-image-box.show {
    opacity: 1;
    transform: scale(1);
  }

  .anim-image-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Name dead center */
  .anim-name {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.88);
    font-size: clamp(28px, 5.5vw, 70px);
    font-weight: 800;
    color: #fff;
    text-shadow: 0 4px 30px rgba(0,0,0,0.95), 0 0 50px rgba(0,0,0,0.7);
    letter-spacing: 2px;
    text-align: center;
    opacity: 0;
    transition: all 0.45s ease;
    white-space: nowrap;
    z-index: 3;
    pointer-events: none;
  }

  .anim-name.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  .close-btn {
    position: absolute;
    top: 18px;
    right: 18px;
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    z-index: 20;
  }

  .close-btn:hover {
    background: rgba(0,0,0,0.75);
  }

  .recording-tip {
    text-align: center;
    font-size: 12px;
    color: #666;
    margin-top: 14px;
  }
</style>
</head>
<body>

<div class="container">
  <h1>IMAGE SEQUENCE</h1>
  <p class="subtitle">YouTube Ready • Add unlimited images</p>

  <div id="imagesContainer">
    <!-- Image cards will be added here -->
  </div>

  <div class="controls">
    <button class="btn btn-add" onclick="addImageCard()">＋ Add Image</button>

    <div class="duration-row">
      <span>Image Duration</span>
      <span class="duration-value" id="durationValue">4s</span>
    </div>
    <input type="range" id="duration" min="2" max="12" value="4" step="0.5">

    <button class="btn btn-start" onclick="startAnimation()">▶ Start Animation</button>
    <button class="btn btn-reset" onclick="resetAll()">Reset All</button>

    <p class="recording-tip">
      Tip: Animation full screen 16:9 hai → OBS / screen recorder se record karke YouTube pe use karo
    </p>
  </div>
</div>

<!-- ANIMATION OVERLAY -->
<div id="animationOverlay">
  <button class="close-btn" onclick="stopAnimation()">✕</button>
  <div class="yt-frame">
    <div class="anim-number" id="animNumber"></div>
    <div class="anim-image-box" id="animImageBox">
      <img id="animImage" src="">
      <div class="anim-name" id="animName"></div>
    </div>
  </div>
</div>

<script>
  let imageData = []; // {src, name}
  let isAnimating = false;
  let timeouts = [];
  let cardCount = 0;

  const durationSlider = document.getElementById('duration');
  const durationValue = document.getElementById('durationValue');
  durationSlider.addEventListener('input', () => {
    durationValue.textContent = durationSlider.value + 's';
  });

  // Create initial 2 cards
  addImageCard();
  addImageCard();

  function addImageCard() {
    cardCount++;
    const id = cardCount;
    const container = document.getElementById('imagesContainer');

    const card = document.createElement('div');
    card.className = 'image-card';
    card.id = `card-${id}`;
    card.innerHTML = `
      <div class="card-header">
        <div class="card-title">IMAGE ${id}</div>
        <button class="remove-btn" onclick="removeCard(${id})" title="Remove">×</button>
      </div>
      <div class="upload-box" id="box-\( {id}" onclick="document.getElementById('file- \){id}').click()">
        <div class="upload-label" id="label-${id}">
          <div class="title">IMAGE ${id}</div>
          <div class="hint">Click or drag & drop</div>
        </div>
        <img id="preview-${id}" style="display:none;">
        <input type="file" id="file-${id}" accept="image/*" hidden>
      </div>
      <input type="text" class="name-input" id="name-${id}" placeholder="Name for Image ${id}">
    `;
    container.appendChild(card);

    // Setup upload
    setupUpload(id);
  }

  function removeCard(id) {
    const cards = document.querySelectorAll('.image-card');
    if (cards.length <= 2) {
      alert('Minimum 2 images required!');
      return;
    }
    document.getElementById(`card-${id}`).remove();
  }

  function setupUpload(id) {
    const box = document.getElementById(`box-${id}`);
    const fileInput = document.getElementById(`file-${id}`);
    const preview = document.getElementById(`preview-${id}`);
    const label = document.getElementById(`label-${id}`);

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) loadImage(file, preview, label, id);
    });

    box.addEventListener('dragover', (e) => {
      e.preventDefault();
      box.classList.add('dragover');
    });
    box.addEventListener('dragleave', () => box.classList.remove('dragover'));
    box.addEventListener('drop', (e) => {
      e.preventDefault();
      box.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) {
        loadImage(file, preview, label, id);
      }
    });
  }

  function loadImage(file, preview, label, id) {
    const reader = new FileReader();
    reader.onload = (e) => {
      preview.src = e.target.result;
      preview.style.display = 'block';
      label.style.display = 'none';
      // store later when starting
    };
    reader.readAsDataURL(file);
  }

  function collectImages() {
    imageData = [];
    const cards = document.querySelectorAll('.image-card');
    cards.forEach((card, index) => {
      const id = card.id.split('-')[1];
      const preview = document.getElementById(`preview-${id}`);
      const nameInput = document.getElementById(`name-${id}`);
      if (preview && preview.src && preview.style.display !== 'none') {
        imageData.push({
          src: preview.src,
          name: nameInput.value.trim() || `IMAGE ${index + 1}`
        });
      }
    });
    return imageData;
  }

  function startAnimation() {
    const images = collectImages();
    if (images.length < 2) {
      alert('Please upload at least 2 images!');
      return;
    }
    if (isAnimating) return;

    isAnimating = true;
    const duration = parseFloat(durationSlider.value) * 1000;
    const overlay = document.getElementById('animationOverlay');
    const numberEl = document.getElementById('animNumber');
    const imageBox = document.getElementById('animImageBox');
    const imageEl = document.getElementById('animImage');
    const nameEl = document.getElementById('animName');

    overlay.classList.add('active');
    clearTimeouts();

    // Hide number & image initially
    numberEl.classList.remove('show');
    imageBox.classList.remove('show');
    nameEl.classList.remove('show');

    let currentTime = 0;

    images.forEach((img, index) => {
      const num = index + 1;

      // Show number
      timeouts.push(setTimeout(() => {
        numberEl.textContent = num;
        numberEl.classList.add('show');
        imageBox.classList.remove('show');
        nameEl.classList.remove('show');
      }, currentTime));

      currentTime += 1000; // number display time

      // Show image + name
      timeouts.push(setTimeout(() => {
        numberEl.classList.remove('show');
        setTimeout(() => {
          imageEl.src = img.src;
          nameEl.textContent = img.name;
          imageBox.classList.add('show');
          nameEl.classList.add('show');
        }, 350);
      }, currentTime));

      currentTime += duration;
    });

    // End after last image
    timeouts.push(setTimeout(() => {
      stopAnimation();
    }, currentTime + 600));
  }

  function stopAnimation() {
    isAnimating = false;
    clearTimeouts();
    document.getElementById('animationOverlay').classList.remove('active');
  }

  function clearTimeouts() {
    timeouts.forEach(t => clearTimeout(t));
    timeouts = [];
  }

  function resetAll() {
    stopAnimation();
    document.getElementById('imagesContainer').innerHTML = '';
    cardCount = 0;
    addImageCard();
    addImageCard();
    durationSlider.value = 4;
    durationValue.textContent = '4s';
  }
</script>
</body>
</html>
