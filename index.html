<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkFlow | Branded Custom Domains</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { 50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd', 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af', 900: '#1e3a8a' },
                        darkBg: '#020617', darkCard: '#0f172a'
                    },
                    borderRadius: { '2xl': '1rem', '3xl': '1.5rem' }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; transition: all 0.3s ease; }
        .dark body { background-color: #020617; }
        .page-enter { animation: slideUpFade 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        @keyframes slideUpFade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .dark .glass { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.05); }
        .nav-item.active { background: linear-gradient(90deg, rgba(59, 130, 246, 0.1) 0%, transparent 100%); border-left: 4px solid #3b82f6; color: #3b82f6; }
    </style>
</head>
<body class="text-slate-900 dark:text-slate-100 min-h-screen flex flex-col overflow-x-hidden">

    <div id="sidebar-overlay" class="fixed inset-0 bg-slate-900/40 z-40 hidden backdrop-blur-sm lg:hidden transition-opacity duration-300"></div>

    <div class="flex flex-1 relative h-screen overflow-hidden">
        
        <!-- Sidebar -->
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-72 bg-white dark:bg-darkCard border-r dark:border-slate-800/50 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out flex flex-col shadow-2xl lg:shadow-none">
            <div class="p-8 flex items-center gap-3">
                <div class="w-10 h-10 bg-primary-600 rounded-xl flex items-center justify-center shadow-lg shadow-primary-500/30">
                    <i data-lucide="link-2" class="text-white w-6 h-6"></i>
                </div>
                <h1 class="text-2xl font-extrabold tracking-tight bg-gradient-to-r from-primary-600 to-blue-400 bg-clip-text text-transparent">LinkFlow</h1>
            </div>

            <nav class="flex-1 px-4 space-y-1.5 overflow-y-auto pt-4">
                <p class="px-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Main Menu</p>
                <a href="#" onclick="navigate('dashboard')" class="nav-item active flex items-center gap-3 px-4 py-3.5 rounded-r-xl transition-all font-semibold hover:bg-slate-50 dark:hover:bg-slate-800/50" data-page="dashboard">
                    <i data-lucide="layout-grid" class="w-5 h-5"></i> Dashboard
                </a>
                <a href="#" onclick="navigate('links')" class="nav-item flex items-center gap-3 px-4 py-3.5 rounded-r-xl transition-all font-semibold text-slate-500 dark:text-slate-400 hover:text-primary-600" data-page="links">
                    <i data-lucide="link" class="w-5 h-5"></i> Manage Links
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col min-w-0 bg-transparent h-full">
            
            <!-- Top Navbar -->
            <header class="h-20 glass sticky top-0 z-30 flex items-center justify-between px-6 lg:px-10 border-b dark:border-slate-800/50">
                <div class="flex items-center gap-4">
                    <button id="mobile-toggle" class="lg:hidden p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
                        <i data-lucide="menu" class="w-6 h-6"></i>
                    </button>
                    <h2 id="view-title" class="text-xl font-bold tracking-tight">Dashboard</h2>
                </div>

                <div class="flex items-center gap-6">
                    <div class="flex items-center gap-3 px-4 py-2 bg-white/50 dark:bg-slate-800/50 rounded-2xl border dark:border-slate-700/50">
                        <div class="w-8 h-8 rounded-lg bg-green-100 dark:bg-green-900/30 flex items-center justify-center text-green-600">
                            <i data-lucide="dollar-sign" class="w-4 h-4"></i>
                        </div>
                        <p class="text-sm font-bold text-slate-700 dark:text-white" id="nav-balance">$0.00</p>
                    </div>
                    <button onclick="toggleTheme()" class="p-2.5 rounded-xl border dark:border-slate-700">
                        <i data-lucide="moon" class="w-5 h-5 dark:hidden"></i>
                        <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
                    </button>
                </div>
            </header>

            <!-- Page Container -->
            <div id="page-content" class="flex-1 overflow-y-auto p-6 lg:p-10 space-y-8">
                
                <section id="view-dashboard" class="page-enter space-y-8">
                    <div class="flex flex-col xl:flex-row gap-8">
                        <!-- Shortener -->
                        <div class="flex-1 bg-white dark:bg-darkCard p-8 rounded-[2rem] border dark:border-slate-800/50 shadow-sm">
                            <h3 class="text-2xl font-extrabold mb-2 text-primary-600">Create Branded Link</h3>
                            <p class="text-slate-500 text-sm mb-8">Now supporting <b>youtube.com</b> custom simulation.</p>
                            
                            <div class="flex flex-col gap-5">
                                <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
                                    <div class="md:col-span-4">
                                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 ml-1">Domain Name</label>
                                        <select id="domain-select" class="w-full px-4 py-4 rounded-2xl bg-slate-50 dark:bg-slate-900 border-2 border-transparent focus:border-red-500 outline-none font-bold text-slate-700 dark:text-white appearance-none cursor-pointer">
                                            <option value="youtube.com">youtube.com (Simulated)</option>
                                            <option value="linkflow.io">linkflow.io (Default)</option>
                                            <option value="bit.ly">bit.ly</option>
                                        </select>
                                    </div>
                                    <div class="md:col-span-8">
                                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 ml-1">Paste Long URL</label>
                                        <input type="text" id="long-url" placeholder="https://www.google.com/search?q=LinkFlow" class="w-full px-6 py-4 rounded-2xl bg-slate-50 dark:bg-slate-900 border-2 border-transparent focus:border-primary-500 outline-none font-medium transition-all">
                                    </div>
                                </div>
                                <button onclick="shortenLink()" class="w-full py-4 bg-primary-600 hover:bg-primary-700 text-white rounded-2xl font-bold shadow-lg shadow-primary-600/20 transition-all flex items-center justify-center gap-2">
                                    Shorten with Custom Domain <i data-lucide="rocket" class="w-5 h-5"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Result Card -->
                        <div id="result-container" class="hidden w-full xl:w-96 bg-white dark:bg-darkCard p-8 rounded-[2rem] border-2 border-primary-500/20 shadow-xl page-enter">
                            <h4 class="text-lg font-bold mb-4 text-green-500 flex items-center gap-2">
                                <i data-lucide="check-circle" class="w-5 h-5"></i> Link Ready!
                            </h4>
                            <div class="p-5 bg-slate-50 dark:bg-slate-900 rounded-2xl mb-6 border dark:border-slate-800">
                                <p id="short-url-text" class="text-primary-600 font-extrabold text-xl text-center break-all"></p>
                            </div>
                            <div class="grid grid-cols-1 gap-2">
                                <button onclick="visitLink(document.getElementById('short-url-text').innerText)" class="flex items-center justify-center gap-2 py-3 bg-red-600 text-white rounded-xl font-bold text-sm hover:bg-red-700 transition-all">
                                    <i data-lucide="play-circle" class="w-4 h-4"></i> Visit (Tracking Active)
                                </button>
                                <div class="grid grid-cols-2 gap-2">
                                    <button onclick="copyResult()" class="py-3 bg-slate-100 dark:bg-slate-800 rounded-xl font-bold text-xs hover:bg-slate-200 dark:hover:bg-slate-700">Copy URL</button>
                                    <button onclick="openQR()" class="py-3 bg-slate-100 dark:bg-slate-800 rounded-xl font-bold text-xs hover:bg-slate-200 dark:hover:bg-slate-700">QR Code</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Small Stats -->
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
                        <div class="bg-white dark:bg-darkCard p-6 rounded-3xl border dark:border-slate-800/50 shadow-sm">
                            <p class="text-slate-400 text-[10px] font-bold uppercase tracking-widest">Total Clicks</p>
                            <h4 class="text-3xl font-extrabold mt-1" id="stat-clicks">0</h4>
                        </div>
                        <div class="bg-white dark:bg-darkCard p-6 rounded-3xl border dark:border-slate-800/50 shadow-sm">
                            <p class="text-slate-400 text-[10px] font-bold uppercase tracking-widest">Active Links</p>
                            <h4 class="text-3xl font-extrabold mt-1" id="stat-links">0</h4>
                        </div>
                        <div class="bg-white dark:bg-darkCard p-6 rounded-3xl border dark:border-slate-800/50 shadow-sm">
                            <p class="text-slate-400 text-[10px] font-bold uppercase tracking-widest">Earned</p>
                            <h4 class="text-3xl font-extrabold mt-1 text-green-500" id="stat-revenue">$0.00</h4>
                        </div>
                    </div>
                </section>

                <section id="dynamic-view" class="hidden page-enter"></section>
            </div>
        </main>
    </div>

    <!-- QR Modal -->
    <div id="qr-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-6 bg-slate-900/60 backdrop-blur-md">
        <div class="bg-white dark:bg-darkCard p-8 rounded-[2.5rem] w-full max-w-sm shadow-2xl text-center">
            <div id="qr-target" class="bg-white p-4 rounded-3xl inline-block mb-6 border"></div>
            <button onclick="closeQR()" class="w-full py-4 bg-primary-600 text-white rounded-2xl font-bold">Close</button>
        </div>
    </div>

    <div id="toast-box" class="fixed bottom-10 left-1/2 -translate-x-1/2 z-[110] flex flex-col gap-3"></div>

    <script>
        const state = {
            links: JSON.parse(localStorage.getItem('lf_links')) || [],
            clicks: parseInt(localStorage.getItem('lf_clicks')) || 0
        };

        function init() {
            lucide.createIcons();
            updateStats();
            if(localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
        }

        function shortenLink() {
            const long = document.getElementById('long-url').value;
            const domain = document.getElementById('domain-select').value;
            
            if (!long || !long.startsWith('http')) {
                showToast("Please enter a valid URL (http/https)", "error");
                return;
            }

            const code = Math.random().toString(36).substring(7);
            const short = `${domain}/${code}`; // Branded Domain applied here

            const newLink = {
                id: Date.now(),
                long: long,
                short: short,
                clicks: 0,
                date: new Date().toLocaleDateString()
            };

            state.links.unshift(newLink);
            localStorage.setItem('lf_links', JSON.stringify(state.links));

            document.getElementById('short-url-text').innerText = short;
            document.getElementById('result-container').classList.remove('hidden');
            
            updateStats();
            showToast(`Branded link created on ${domain}!`, "success");
        }

        function visitLink(shortUrlText) {
            const linkObj = state.links.find(l => l.short === shortUrlText);
            if (linkObj) {
                linkObj.clicks++;
                state.clicks++;
                localStorage.setItem('lf_links', JSON.stringify(state.links));
                localStorage.setItem('lf_clicks', state.clicks);
                showToast("Simulating branded redirect...", "success");
                updateStats();
                setTimeout(() => { window.open(linkObj.long, '_blank'); }, 800);
            }
        }

        function updateStats() {
            const revenue = (state.clicks * 0.005).toFixed(2);
            document.getElementById('stat-clicks').innerText = state.clicks;
            document.getElementById('stat-revenue').innerText = `$${revenue}`;
            document.getElementById('nav-balance').innerText = `$${revenue}`;
            document.getElementById('stat-links').innerText = state.links.length;
        }

        function navigate(page) {
            const dash = document.getElementById('view-dashboard');
            const dyn = document.getElementById('dynamic-view');
            const title = document.getElementById('view-title');

            if (page === 'dashboard') {
                dash.classList.remove('hidden');
                dyn.classList.add('hidden');
                title.innerText = "Dashboard";
            } else {
                dash.classList.add('hidden');
                dyn.classList.remove('hidden');
                title.innerText = "Manage Links";
                renderLinksPage();
            }
        }

        function renderLinksPage() {
            let html = `<h3 class="text-2xl font-bold mb-6">Your Branded Links</h3><div class="space-y-4">`;
            state.links.forEach(link => {
                html += `
                    <div class="bg-white dark:bg-darkCard p-6 rounded-3xl border dark:border-slate-800 flex justify-between items-center">
                        <div class="min-w-0">
                            <p class="font-extrabold text-primary-600 truncate">${link.short}</p>
                            <p class="text-xs text-slate-400 truncate">${link.long}</p>
                        </div>
                        <div class="flex items-center gap-4">
                            <p class="font-bold text-sm">${link.clicks} <span class="text-[10px] text-slate-400">CLICKS</span></p>
                            <button onclick="visitLink('${link.short}')" class="p-2 bg-slate-100 dark:bg-slate-800 rounded-xl"><i data-lucide="external-link" class="w-4 h-4"></i></button>
                        </div>
                    </div>`;
            });
            document.getElementById('dynamic-view').innerHTML = html;
            lucide.createIcons();
        }

        function copyResult() {
            navigator.clipboard.writeText(document.getElementById('short-url-text').innerText);
            showToast("Copied!", "success");
        }

        function showToast(m, t) {
            const b = document.getElementById('toast-box');
            const d = document.createElement('div');
            d.className = `px-6 py-3 rounded-2xl text-white font-bold text-sm shadow-xl animate-bounce ${t==='success'?'bg-slate-900':'bg-red-500'}`;
            d.innerText = m;
            b.appendChild(d);
            setTimeout(() => d.remove(), 3000);
        }

        function toggleTheme() { document.documentElement.classList.toggle('dark'); localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light'); }
        function openQR() { 
            const target = document.getElementById('qr-target'); 
            target.innerHTML = ''; 
            new QRCode(target, { text: document.getElementById('short-url-text').innerText, width: 150, height: 150 });
            document.getElementById('qr-modal').classList.remove('hidden'); 
        }
        function closeQR() { document.getElementById('qr-modal').classList.add('hidden'); }

        window.onload = init;
    </script>
</body>
</html>
