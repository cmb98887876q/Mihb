<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Food Hub | Delicious Food, Delivered.</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    <style>
        :root {
            --primary-navy: #08143D;
            --accent-pink: #FF3F8E;
            --white: #FFFFFF;
            --light-gray: #F5F5F6;
            --main-text: #202124;
            --muted-text: #777777;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 20px rgba(0,0,0,0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--white);
            color: var(--main-text);
            overflow-x: hidden;
        }

        /* --- HEADER --- */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--white);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-sm);
        }

        .header-left { display: flex; align-items: center; gap: 15px; }
        .logo { font-family: 'Pacifico', cursive; font-size: 24px; color: var(--primary-navy); margin-bottom: -4px; }
        .btn-icon { font-size: 24px; color: var(--primary-navy); display: flex; align-items: center; }

        .desktop-nav { display: none; }

        .header-right { display: flex; align-items: center; gap: 12px; }
        .btn-login {
            background: var(--primary-navy);
            color: var(--white);
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: 500;
            font-size: 14px;
        }

        /* --- HOME SEARCH TRIGGER --- */
        .home-search-section {
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .search-trigger-bar {
            display: flex;
            align-items: center;
            background: var(--white);
            border: 1px solid #E0E0E0;
            border-radius: 100px;
            padding: 12px 20px;
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            color: var(--muted-text);
            font-size: 14px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .search-trigger-bar i { margin-right: 12px; font-size: 18px; }

        /* --- FULL SCREEN SEARCH OVERLAY --- */
        .search-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--white);
            z-index: 2000;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
        }

        .search-overlay.active { transform: translateY(0); }

        .search-overlay-header {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid #EEE;
        }

        .search-input-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            background: var(--light-gray);
            border-radius: 12px;
            padding: 8px 15px;
        }

        .search-input-wrapper input {
            flex: 1;
            border: none;
            background: none;
            outline: none;
            padding: 5px;
            font-size: 15px;
            font-family: inherit;
        }

        .btn-search-action {
            background: var(--accent-pink);
            color: var(--white);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .search-results-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: var(--primary-navy);
        }

        /* --- CATEGORIES SECTION --- */
        .categories-section {
            background: var(--primary-navy);
            padding: 40px 20px 60px;
            min-height: 100vh;
        }

        .section-header { max-width: 1280px; margin: 0 auto 30px; color: var(--white); }
        .section-header h2 { font-size: 24px; }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            max-width: 1280px;
            margin: 0 auto;
        }

        .category-card {
            background: var(--white);
            border-radius: 20px;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            box-shadow: var(--shadow-sm);
        }

        .img-container { width: 80px; height: 80px; border-radius: 50%; overflow: hidden; margin-bottom: 12px; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; }
        .category-name { font-size: 12px; font-weight: 500; color: var(--primary-navy); }

        .badge-new {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #FFD700;
            font-size: 9px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* --- DRAWER --- */
        .drawer-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(8, 20, 61, 0.4); backdrop-filter: blur(4px);
            z-index: 1000; display: none;
        }
        .drawer {
            position: fixed; top: 0; left: 0; width: 280px; height: 100%;
            background: var(--white); z-index: 1001;
            transform: translateX(-100%); transition: var(--transition);
            padding: 30px 20px;
        }
        body.drawer-open .drawer { transform: translateX(0); }
        body.drawer-open .drawer-overlay { display: block; }

        /* --- DESKTOP REFINEMENTS --- */
        @media (min-width: 1024px) {
            .desktop-nav { display: flex; gap: 30px; margin-left: 50px; }
            .nav-link { font-weight: 500; color: var(--primary-navy); }
            .btn-menu { display: none; }
            .category-grid { grid-template-columns: repeat(5, 1fr); }
            .img-container { width: 120px; height: 120px; }
        }
    </style>
</head>
<body>

    <!-- SEARCH OVERLAY -->
    <div class="search-overlay" id="searchOverlay">
        <div class="search-overlay-header">
            <button class="btn-icon" id="closeSearch"><i class="ri-arrow-left-line"></i></button>
            <div class="search-input-wrapper">
                <i class="ri-search-line" style="margin-right: 10px; color: var(--muted-text);"></i>
                <input type="text" id="mainSearchInput" placeholder="Search pizza, desserts...">
                <button class="btn-search-action" id="searchExecBtn"><i class="ri-arrow-right-line"></i></button>
            </div>
        </div>
        <div class="search-results-area">
            <div class="section-header">
                <h2 id="searchTitle">Quick Suggestions</h2>
            </div>
            <div class="category-grid" id="searchResultGrid">
                <!-- Filtered results appear here -->
            </div>
        </div>
    </div>

    <!-- HEADER -->
    <header>
        <div class="header-left">
            <button class="btn-icon btn-menu" id="openDrawer"><i class="ri-menu-2-line"></i></button>
            <div class="logo">Food hub</div>
            <nav class="desktop-nav">
                <a href="#" class="nav-link">Home</a>
                <a href="#" class="nav-link">Categories</a>
                <a href="#" class="nav-link">Offers</a>
            </nav>
        </div>
        <div class="header-right">
            <button class="btn-icon" id="headerSearchBtn"><i class="ri-search-line"></i></button>
            <button class="btn-login">Log in</button>
        </div>
    </header>

    <!-- HOME SEARCH TRIGGER -->
    <section class="home-search-section">
        <div class="search-trigger-bar" id="homeSearchTrigger">
            <i class="ri-search-line"></i>
            <span>Search for pizza, burgers & more</span>
        </div>
    </section>

    <!-- CATEGORIES -->
    <main class="categories-section">
        <div class="section-header">
            <h2>Explore Food</h2>
            <p style="color: #A0ABC0; font-size: 14px;">Choose your favourite category</p>
        </div>
        <div class="category-grid" id="homeCategoryGrid"></div>
    </main>

    <!-- DRAWER -->
    <div class="drawer-overlay" id="drawerOverlay"></div>
    <div class="drawer">
        <div class="logo" style="margin-bottom: 40px;">Food hub</div>
        <div style="display: flex; flex-direction: column; gap: 20px;">
            <a href="#" style="font-weight: 600; color: var(--accent-pink);"><i class="ri-home-line"></i> Home</a>
            <a href="#" style="font-weight: 500;"><i class="ri-restaurant-line"></i> Categories</a>
            <a href="#" style="font-weight: 500;"><i class="ri-heart-line"></i> Favorites</a>
            <a href="#" style="font-weight: 500;"><i class="ri-shopping-bag-line"></i> My Orders</a>
        </div>
    </div>

    <script>
        const categories = [
            { name: 'Slices', img: 'https://images.unsplash.com/photo-1513104890138-7c749659a591?w=300', isNew: true },
            { name: 'Midnight Menu', img: 'https://images.unsplash.com/photo-1541745537411-b8046dc6d66c?w=300' },
            { name: 'Big Big Pizza', img: 'https://images.unsplash.com/photo-1593560708920-61dd98c46a4e?w=300' },
            { name: 'Veg Pizza', img: 'https://images.unsplash.com/photo-1571407970349-bc81e7e96d47?w=300' },
            { name: 'Pizza Mania', img: 'https://images.unsplash.com/photo-1604382354936-07c5d9983bd3?w=300' },
            { name: 'Garlic Breads', img: 'https://images.unsplash.com/photo-1573140247632-f8fd74997d5c?w=300' },
            { name: 'Combos', img: 'https://images.unsplash.com/photo-1513104890138-7c749659a591?w=300' },
            { name: 'Cheese Burst', img: 'https://images.unsplash.com/photo-1594007654729-407eedc4be65?w=300' },
            { name: 'Cheese Lava', img: 'https://images.unsplash.com/photo-1544982503-9f984c14501a?w=300', isNew: true },
            { name: 'Cheese Volcano', img: 'https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=300', isNew: true },
            { name: 'Desserts', img: 'https://images.unsplash.com/photo-1551024506-0bccd828d307?w=300' },
            { name: 'Beverages', img: 'https://images.unsplash.com/photo-1622483767028-3f66f32aef97?w=300' }
        ];

        function createCard(cat) {
            return `
                <div class="category-card">
                    ${cat.isNew ? '<span class="badge-new">NEW</span>' : ''}
                    <div class="img-container"><img src="${cat.img}" loading="lazy"></div>
                    <div class="category-name">${cat.name}</div>
                </div>`;
        }

        const homeGrid = document.getElementById('homeCategoryGrid');
        homeGrid.innerHTML = categories.map(c => createCard(c)).join('');

        // Search Logic
        const overlay = document.getElementById('searchOverlay');
        const searchInput = document.getElementById('mainSearchInput');
        const searchResultGrid = document.getElementById('searchResultGrid');
        const searchTitle = document.getElementById('searchTitle');

        function openSearch() {
            overlay.classList.add('active');
            setTimeout(() => searchInput.focus(), 300);
            updateSearch();
        }

        function closeSearch() {
            overlay.classList.remove('active');
            searchInput.value = '';
        }

        function updateSearch() {
            const val = searchInput.value.toLowerCase();
            const filtered = categories.filter(c => c.name.toLowerCase().includes(val));
            searchTitle.innerText = val ? `Results for "${val}"` : "Quick Suggestions";
            searchResultGrid.innerHTML = filtered.map(c => createCard(c)).join('');
        }

        document.getElementById('homeSearchTrigger').onclick = openSearch;
        document.getElementById('headerSearchBtn').onclick = openSearch;
        document.getElementById('closeSearch').onclick = closeSearch;
        searchInput.oninput = updateSearch;

        // Drawer Logic
        document.getElementById('openDrawer').onclick = () => document.body.classList.add('drawer-open');
        document.getElementById('drawerOverlay').onclick = () => document.body.classList.remove('drawer-open');
    </script>
</body>
</html>
