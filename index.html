<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini SPA Demo</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}
body{
    background:#f4f4f4;
}
nav{
    background:#1e88e5;
    color:#fff;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 20px;
}
nav button{
    background:white;
    color:#1e88e5;
    border:none;
    padding:8px 15px;
    border-radius:5px;
    cursor:pointer;
}

.page{
    display:none;
    padding:25px;
}

.page.active{
    display:block;
}

.card{
    background:#fff;
    max-width:400px;
    margin:30px auto;
    padding:20px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
}

input{
    width:100%;
    padding:10px;
    margin:10px 0;
}

button.action{
    width:100%;
    padding:10px;
    background:#1e88e5;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}
</style>
</head>
<body>

<nav>
    <h2>My App</h2>
    <button onclick="go('/')">Home</button>
</nav>

<!-- Home -->
<div id="home" class="page active">
    <div class="card">
        <h2>🏠 Home</h2>
        <p>This is Home Page.</p>
        <br>
        <button class="action" onclick="go('/login')">
            Go to Login
        </button>
    </div>
</div>

<!-- Login -->
<div id="login" class="page">
    <div class="card">
        <h2>Login</h2>

        <input type="text" placeholder="Username">
        <input type="password" placeholder="Password">

        <button class="action" onclick="go('/dashboard')">
            Login
        </button>
    </div>
</div>

<!-- Dashboard -->
<div id="dashboard" class="page">
    <div class="card">
        <h2>Dashboard</h2>
        <p>Welcome! You are logged in.</p>
        <br>

        <button class="action" onclick="go('/profile')">
            Profile
        </button>
    </div>
</div>

<!-- Profile -->
<div id="profile" class="page">
    <div class="card">
        <h2>Profile</h2>
        <p>Name : Hassan</p>
        <p>Email : demo@email.com</p>

        <br>

        <button class="action" onclick="go('/')">
            Logout
        </button>
    </div>
</div>

<script>

function show(page){
    document.querySelectorAll(".page")
    .forEach(p=>p.classList.remove("active"));

    document.getElementById(page)
    .classList.add("active");
}

function go(path){

    history.pushState({}, "", path);

    if(path=="/"){
        show("home");
    }
    else if(path=="/login"){
        show("login");
    }
    else if(path=="/dashboard"){
        show("dashboard");
    }
    else if(path=="/profile"){
        show("profile");
    }
}

window.onpopstate=()=>{
    go(location.pathname);
};

go(location.pathname);

</script>

</body>
</html>
