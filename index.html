<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR PRO | Professional Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="text/javascript" src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        [x-cloak] { display: none !important; }
        .qr-gradient { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); }
        .glass-card { background: white; border: 1px solid #e2e8f0; }
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #6366f1;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen" x-data="qrApp()">

    <!-- Header -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
            <div class="flex items-center gap-2 cursor-pointer" @click="resetToHome()">
                <div class="p-2 qr-gradient rounded-lg text-white">
                    <i data-lucide="qr-code" class="w-6 h-6"></i>
                </div>
                <span class="font-bold text-xl tracking-tight">QR<span class="text-indigo-600">PRO</span></span>
            </div>
            
            <div class="flex items-center gap-4">
                <template x-if="!user">
                    <button @click="showAuthModal = true" class="text-sm font-semibold text-indigo-600">Login / Sign Up</button>
                </template>
                <template x-if="user">
                    <div class="flex items-center gap-4">
                        <button @click="view = 'history'; fetchHistory()" class="text-sm font-medium hover:text-indigo-600 flex items-center gap-1">
                            <i data-lucide="history" class="w-4 h-4"></i> History
                        </button>
                        <button @click="logout()" class="p-2 text-slate-400 hover:text-red-500"><i data-lucide="log-out" class="w-5 h-5"></i></button>
                    </div>
                </template>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- View: Generator -->
        <div x-show="view === 'generator'" class="space-y-8">
            <div class="flex justify-center">
                <div class="bg-slate-200/50 p-1 rounded-xl flex">
                    <button @click="switchType('link')" :class="currentQR.type === 'link' ? 'bg-white shadow text-indigo-600' : 'text-slate-500'" class="px-8 py-2 rounded-lg font-bold transition-all">Link</button>
                    <button @click="switchType('message')" :class="currentQR.type === 'message' ? 'bg-white shadow text-indigo-600' : 'text-slate-500'" class="px-8 py-2 rounded-lg font-bold transition-all">Message</button>
                </div>
            </div>

            <div class="grid lg:grid-cols-2 gap-8 items-start">
                <!-- Input Section -->
                <div class="glass-card rounded-3xl p-6 sm:p-8 shadow-sm">
                    <h2 class="text-xl font-bold mb-4" x-text="currentQR.type === 'link' ? 'Enter Website URL' : 'Enter Message'"></h2>
                    
                    <template x-if="currentQR.type === 'link'">
                        <input type="url" x-model="currentQR.content" @input="handleInputChange()" placeholder="https://example.com" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-indigo-500 text-lg">
                    </template>

                    <template x-if="currentQR.type === 'message'">
                        <textarea x-model="currentQR.content" @input="handleInputChange()" rows="5" placeholder="Type your message here..." class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-indigo-500 text-lg"></textarea>
                    </template>

                    <div x-show="error" class="mt-3 text-red-500 text-sm font-medium" x-text="error"></div>

                    <div class="mt-8 flex gap-3">
                        <button @click="resetToHome()" class="flex-1 py-4 border border-slate-200 rounded-xl font-bold hover:bg-slate-50">Clear</button>
                    </div>
                </div>

                <!-- Preview Section -->
                <div class="glass-card rounded-3xl p-8 shadow-sm text-center">
                    <div id="qr-display" class="bg-white p-4 rounded-2xl border border-slate-100 inline-block mb-6 relative min-w-[280px] min-h-[280px]">
                        <div x-show="!currentQR.content" class="absolute inset-0 flex flex-col items-center justify-center text-slate-300">
                            <i data-lucide="qr-code" class="w-16 h-16 mb-2"></i>
                            <p class="text-sm font-medium">No Data Entered</p>
                        </div>
                    </div>

                    <div x-show="currentQR.content && !error">
                        <div class="mb-6">
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Encoded Content</p>
                            <p class="font-medium text-slate-700 truncate max-w-xs mx-auto" x-text="currentQR.content"></p>
                        </div>

                        <div class="grid grid-cols-2 gap-3 mb-4">
                            <button @click="download('png')" class="py-3 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700">PNG</button>
                            <button @click="download('svg')" class="py-3 bg-slate-800 text-white rounded-xl font-bold hover:bg-black">SVG</button>
                        </div>

                        <button @click="saveToDatabase()" :disabled="isBusy" class="w-full py-4 qr-gradient text-white rounded-xl font-bold shadow-lg flex items-center justify-center gap-2">
                            <i data-lucide="save" class="w-5 h-5"></i>
                            <span x-text="editingId ? 'Update QR Details' : 'Save to History'"></span>
                        </button>
                        <template x-if="!user">
                            <p class="mt-2 text-[11px] text-slate-400 italic">Note: Login required to save history.</p>
                        </template>
                    </div>
                </div>
            </div>
        </div>

        <!-- View: History -->
        <div x-show="view === 'history'" x-cloak>
            <div class="flex items-center justify-between mb-8">
                <h2 class="text-2xl font-bold">Your Saved QRs</h2>
                <button @click="view = 'generator'" class="text-indigo-600 font-bold flex items-center gap-2">
                    <i data-lucide="plus" class="w-5 h-5"></i> Create New
                </button>
            </div>

            <div x-show="loadingHistory" class="flex justify-center py-20"><div class="loader"></div></div>

            <div x-show="!loadingHistory && history.length === 0" class="text-center py-20 bg-white rounded-3xl border border-dashed border-slate-300">
                <p class="text-slate-400">No QR codes saved yet.</p>
            </div>

            <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                <template x-for="item in history" :key="item.id">
                    <div class="glass-card rounded-2xl p-5 hover:border-indigo-300 transition-colors">
                        <div class="flex justify-between items-start mb-4">
                            <div class="p-2 bg-indigo-50 text-indigo-600 rounded-lg">
                                <i :data-lucide="item.type === 'link' ? 'link' : 'message-square'" class="w-5 h-5"></i>
                            </div>
                            <span class="text-[10px] font-bold text-slate-400 uppercase" x-text="new Date(item.createdAt).toLocaleDateString()"></span>
                        </div>
                        <p class="font-bold text-slate-800 truncate mb-1" x-text="item.content"></p>
                        <p class="text-xs text-slate-400 mb-4" x-text="item.type"></p>
                        <div class="flex gap-2 border-t pt-4">
                            <button @click="editExisting(item)" class="flex-1 py-2 bg-slate-100 rounded-lg text-xs font-bold hover:bg-indigo-600 hover:text-white transition-colors">EDIT</button>
                            <button @click="deleteItem(item.id)" class="px-3 py-2 text-red-500 hover:bg-red-50 rounded-lg transition-colors"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </main>

    <!-- Auth Modal -->
    <div x-show="showAuthModal" x-cloak class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4">
        <div class="bg-white rounded-3xl p-8 w-full max-w-md shadow-2xl">
            <h2 class="text-2xl font-bold mb-2">Account</h2>
            <p class="text-slate-500 mb-6">Sign in to sync your QR codes across devices.</p>
            <div class="space-y-3">
                <button @click="login('google')" class="w-full py-4 border border-slate-200 rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-slate-50">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/pwa_site/google.svg" class="w-5 h-5"> Continue with Google
                </button>
                <button @click="showAuthModal = false" class="w-full py-2 text-slate-400 text-sm font-medium">Close</button>
            </div>
        </div>
    </div>

    <script>
        // YOUR SPECIFIC FIREBASE CONFIG
        const configMain = { 
            apiKey: "AIzaSyDzZf-VbpRE65xIhAqObqKECucp9Pp2EDg", 
            authDomain: "app-stor-f8cd2.firebaseapp.com", 
            databaseURL: "https://app-stor-f8cd2-default-rtdb.firebaseio.com", 
            projectId: "app-stor-f8cd2" 
        };

        firebase.initializeApp(configMain);
        const auth = firebase.auth();
        const db = firebase.firestore();

        function qrApp() {
            return {
                view: 'generator',
                user: null,
                showAuthModal: false,
                isBusy: false,
                loadingHistory: false,
                error: '',
                qrInstance: null,
                editingId: null, // Track if we are updating an old QR or saving a new one
                history: [],

                // SINGLE SOURCE OF TRUTH
                currentQR: {
                    type: 'link',
                    content: ''
                },

                init() {
                    auth.onAuthStateChanged(u => {
                        this.user = u;
                        if (u) this.fetchHistory();
                    });
                    lucide.createIcons();
                },

                resetToHome() {
                    this.view = 'generator';
                    this.editingId = null;
                    this.currentQR.content = '';
                    this.error = '';
                    this.currentQR.type = 'link';
                    this.clearDisplay();
                },

                switchType(type) {
                    this.currentQR.type = type;
                    this.currentQR.content = '';
                    this.editingId = null;
                    this.clearDisplay();
                },

                handleInputChange() {
                    this.validate();
                    this.generateQR();
                },

                validate() {
                    this.error = '';
                    if (!this.currentQR.content) return false;
                    if (this.currentQR.type === 'link') {
                        const pattern = /^(https?:\/\/)?([\da-z.-]+)\.([a-z.]{2,6})([\/\w .-]*)*\/?$/;
                        if (!pattern.test(this.currentQR.content)) {
                            this.error = 'Invalid URL format';
                            return false;
                        }
                    }
                    return true;
                },

                clearDisplay() {
                    const container = document.getElementById('qr-display');
                    if (container) container.innerHTML = '';
                    this.qrInstance = null;
                },

                generateQR() {
                    this.clearDisplay();
                    if (!this.currentQR.content || this.error) return;

                    // NEW GENERATION FLOW
                    this.qrInstance = new QRCodeStyling({
                        width: 280,
                        height: 280,
                        data: this.currentQR.content,
                        dotsOptions: { color: "#4f46e5", type: "extra-rounded" },
                        backgroundOptions: { color: "#ffffff" },
                        cornersSquareOptions: { type: "extra-rounded", color: "#312e81" }
                    });

                    this.qrInstance.append(document.getElementById('qr-display'));
                    lucide.createIcons();
                },

                async download(ext) {
                    if (this.qrInstance) {
                        this.qrInstance.download({ name: "qr-code", extension: ext });
                    }
                },

                async login(providerName) {
                    const provider = new firebase.auth.GoogleAuthProvider();
                    try {
                        await auth.signInWithPopup(provider);
                        this.showAuthModal = false;
                    } catch (e) { alert(e.message); }
                },

                async logout() {
                    await auth.signOut();
                    this.resetToHome();
                },

                // DATABASE OPERATIONS
                async saveToDatabase() {
                    if (!this.user) {
                        this.showAuthModal = true;
                        return;
                    }
                    if (!this.currentQR.content || this.error) return;

                    this.isBusy = true;
                    const payload = {
                        uid: this.user.uid,
                        type: this.currentQR.type,
                        content: this.currentQR.content,
                        updatedAt: new Date().toISOString()
                    };

                    try {
                        if (this.editingId) {
                            // UPDATE EXISTING
                            await db.collection('qrcodes').doc(this.editingId).update(payload);
                            alert("QR Details Updated!");
                        } else {
                            // CREATE NEW
                            payload.createdAt = new Date().toISOString();
                            await db.collection('qrcodes').add(payload);
                            alert("QR Saved to History!");
                        }
                        this.resetToHome();
                        this.fetchHistory();
                    } catch (e) {
                        alert("Error saving: " + e.message);
                    } finally {
                        this.isBusy = false;
                    }
                },

                async fetchHistory() {
                    if (!this.user) return;
                    this.loadingHistory = true;
                    try {
                        const snap = await db.collection('qrcodes')
                            .where('uid', '==', this.user.uid)
                            .get();
                        this.history = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }))
                            .sort((a,b) => new Date(b.updatedAt) - new Date(a.updatedAt));
                        setTimeout(() => lucide.createIcons(), 100);
                    } catch (e) { console.error(e); }
                    this.loadingHistory = false;
                },

                editExisting(item) {
                    // Load state from history into generator
                    this.view = 'generator';
                    this.editingId = item.id;
                    this.currentQR.type = item.type;
                    this.currentQR.content = item.content;
                    this.generateQR();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                },

                async deleteItem(id) {
                    if (confirm("Delete this QR code permanently?")) {
                        await db.collection('qrcodes').doc(id).delete();
                        this.fetchHistory();
                    }
                }
            }
        }
    </script>
</body>
</html>
