<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #111827;
      padding: 20px;
    }

    header {
      max-width: 1000px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    header h1 {
      color: #2563eb;
    }

    .cart-btn {
      text-decoration: none;
      background: #2563eb;
      color: white;
      padding: 11px 18px;
      border-radius: 8px;
    }

    .products {
      max-width: 1000px;
      margin: auto;
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .product {
      background: white;
      padding: 18px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    .product img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .product h2 {
      font-size: 19px;
      margin-bottom: 8px;
    }

    .price {
      color: #2563eb;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      border: none;
      background: #2563eb;
      color: white;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>

<body>

<header>
  <h1>My Store</h1>

  <a href="cart.html" class="cart-btn">
    🛒 Cart
  </a>
</header>


<div class="products">

  <div class="product">

    <img
      src="https://via.placeholder.com/400x300"
      alt="Wireless Headphones"
    >

    <h2>Wireless Headphones</h2>

    <p class="price">₹999</p>

    <button onclick="addToCart(
      'Wireless Headphones',
      999,
      'https://via.placeholder.com/400x300'
    )">
      Add to Cart
    </button>

  </div>


  <div class="product">

    <img
      src="https://via.placeholder.com/400x300"
      alt="Gaming Mouse"
    >

    <h2>Gaming Mouse</h2>

    <p class="price">₹599</p>

    <button onclick="addToCart(
      'Gaming Mouse',
      599,
      'https://via.placeholder.com/400x300'
    )">
      Add to Cart
    </button>

  </div>


  <div class="product">

    <img
      src="https://via.placeholder.com/400x300"
      alt="Mechanical Keyboard"
    >

    <h2>Mechanical Keyboard</h2>

    <p class="price">₹1499</p>

    <button onclick="addToCart(
      'Mechanical Keyboard',
      1499,
      'https://via.placeholder.com/400x300'
    )">
      Add to Cart
    </button>

  </div>

</div>


<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

  import {
    getAuth,
    signInAnonymously
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

  import {
    getDatabase,
    ref,
    push,
    set
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


  // Firebase configuration
  const configMovie = {

    apiKey:
      "AIzaSyCZQoxcRbowOLLjfRcV8c0vfiTLsfc2Gys",

    authDomain:
      "movie-2-f1b16.firebaseapp.com",

    databaseURL:
      "https://movie-2-f1b16-default-rtdb.firebaseio.com",

    projectId:
      "movie-2-f1b16"
  };


  // Initialize Firebase
  const app = initializeApp(configMovie);

  const auth = getAuth(app);

  const database = getDatabase(app);


  // Anonymous login
  let currentUser;


  async function loginUser() {

    try {

      const result = await signInAnonymously(auth);

      currentUser = result.user;

      console.log(
        "Firebase User:",
        currentUser.uid
      );

    } catch (error) {

      console.error(error);

      alert(
        "Firebase login failed. Check Anonymous Authentication."
      );

    }

  }


  loginUser();


  // Add product to Firebase cart
  window.addToCart = async function(
    name,
    price,
    image
  ) {

    if (!currentUser) {

      alert("Please wait a moment...");
      return;

    }


    try {

      const cartRef = ref(
        database,
        "users/" +
        currentUser.uid +
        "/cart"
      );


      const newCartItem = push(cartRef);


      await set(newCartItem, {

        name: name,

        price: price,

        image: image,

        quantity: 1,

        createdAt: Date.now()

      });


      alert(
        name + " added to cart!"
      );


    } catch (error) {

      console.error(error);

      alert(
        "Could not add product."
      );

    }

  };

</script>

</body>
</html>
