<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Sign in · Fast</title>
<meta name="description" content="Choose how you'd like to sign in." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-0: #08090c;
    --bg-1: #0c0f15;
    --surface: rgba(255, 255, 255, 0.035);
    --surface-hover: rgba(255, 255, 255, 0.06);
    --border: rgba(140, 160, 200, 0.16);
    --border-hover: rgba(150, 180, 255, 0.38);
    --accent: #5b8def;
    --accent-dim: rgba(91, 141, 239, 0.16);
    --text-primary: #eef1f6;
    --text-secondary: #8993a6;
    --text-tertiary: #5b6376;
    --danger: #ff7a7a;
    --danger-bg: rgba(255, 90, 90, 0.08);
    --radius-card: 22px;
    --radius-btn: 14px;
    --font-display: "Sora", "Inter", system-ui, sans-serif;
    --font-body: "Inter", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: var(--font-body);
    color: var(--text-primary);
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(91, 141, 239, 0.16), transparent 60%),
      radial-gradient(ellipse 600px 400px at 85% 100%, rgba(120, 100, 220, 0.08), transparent 60%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 100%);
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }

  @media (prefers-reduced-motion: no-preference) {
    .card {
      animation: rise 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px) scale(0.985); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .card {
    width: 100%;
    max-width: 400px;
    background: var(--surface);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: 38px 28px 30px;
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 0.04) inset,
      0 30px 60px -20px rgba(0, 0, 0, 0.6);
  }

  .mark {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: linear-gradient(135deg, #5b8def, #7c6ff0);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 22px;
    box-shadow: 0 8px 24px -8px rgba(91, 141, 239, 0.55);
  }

  .mark svg { width: 22px; height: 22px; }

  h1 {
    font-family: var(--font-display);
    font-size: 21px;
    font-weight: 600;
    text-align: center;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  .subtitle {
    text-align: center;
    color: var(--text-secondary);
    font-size: 14px;
    line-height: 1.5;
    margin: 0 0 30px;
  }

  .providers {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .provider-btn {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 13px 16px;
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid var(--border);
    border-radius: var(--radius-btn);
    color: var(--text-primary);
    font-family: var(--font-body);
    font-size: 14.5px;
    font-weight: 500;
    cursor: pointer;
    transition: border-color 0.18s ease, background-color 0.18s ease, transform 0.12s ease;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }

  .provider-btn:hover {
    background: var(--surface-hover);
    border-color: var(--border-hover);
  }

  .provider-btn:active {
    transform: scale(0.985);
  }

  .provider-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .provider-btn .icon {
    flex: 0 0 auto;
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .provider-btn .icon svg { width: 100%; height: 100%; }

  .provider-btn .label {
    flex: 1 1 auto;
    text-align: left;
  }

  .provider-btn .chevron {
    flex: 0 0 auto;
    opacity: 0.35;
    transition: opacity 0.18s ease, transform 0.18s ease;
  }

  .provider-btn:hover .chevron {
    opacity: 0.7;
    transform: translateX(2px);
  }

  /* loading state */
  .provider-btn.loading { pointer-events: none; color: var(--text-secondary); }
  .provider-btn.loading .chevron { opacity: 0; }

  .spinner {
    display: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.18);
    border-top-color: var(--accent);
    animation: spin 0.7s linear infinite;
    flex: 0 0 auto;
  }

  .provider-btn.loading .spinner { display: block; }

  @keyframes spin { to { transform: rotate(360deg); } }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 22px 0 16px;
    color: var(--text-tertiary);
    font-size: 12px;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .terms {
    text-align: center;
    color: var(--text-tertiary);
    font-size: 12px;
    line-height: 1.6;
    margin: 0;
  }
  .terms a { color: var(--text-secondary); text-decoration: none; border-bottom: 1px solid var(--border-hover); }
  .terms a:hover { color: var(--text-primary); }

  .error-banner {
    display: none;
    align-items: flex-start;
    gap: 10px;
    background: var(--danger-bg);
    border: 1px solid rgba(255, 122, 122, 0.28);
    color: var(--danger);
    font-size: 13px;
    line-height: 1.5;
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 18px;
  }
  .error-banner.show { display: flex; }
  .error-banner svg { flex: 0 0 auto; margin-top: 1px; }

  @media (max-width: 380px) {
    .card { padding: 30px 20px 24px; }
  }
</style>
</head>
<body>

  <main class="card" role="main">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" fill="white"/></svg>
    </div>

    <h1>Sign in to Fast</h1>
    <p class="subtitle">Choose an account to continue with.</p>

    <div id="errorBanner" class="error-banner" role="alert">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="errorText">Authentication failed. Please try again.</span>
    </div>

    <div class="providers">

      <button class="provider-btn" data-provider="google" type="button">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23.04 12.27c0-.82-.07-1.6-.2-2.36H12v4.47h6.2a5.3 5.3 0 0 1-2.3 3.48v2.9h3.72c2.18-2 3.42-4.96 3.42-8.49Z"/><path fill="#34A853" d="M12 23c3.1 0 5.7-1.02 7.6-2.77l-3.72-2.9c-1.03.7-2.35 1.1-3.88 1.1-2.98 0-5.5-2.01-6.4-4.72H1.77v2.98A11 11 0 0 0 12 23Z"/><path fill="#FBBC05" d="M5.6 13.71a6.6 6.6 0 0 1 0-4.22V6.51H1.77a11 11 0 0 0 0 9.98l3.83-2.78Z"/><path fill="#EA4335" d="M12 4.77c1.69 0 3.2.58 4.4 1.72l3.3-3.3C17.7 1.24 15.1 0 12 0A11 11 0 0 0 1.77 6.51l3.83 2.98c.9-2.71 3.42-4.72 6.4-4.72Z"/></svg>
        </span>
        <span class="label">Continue with Google</span>
        <span class="spinner" aria-hidden="true"></span>
        <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
      </button>

      <button class="provider-btn" data-provider="facebook" type="button">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path fill="#1877F2" d="M24 12.07C24 5.41 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.69 4.53-4.69 1.31 0 2.68.24 2.68.24v2.97h-1.51c-1.49 0-1.95.93-1.95 1.89v2.25h3.32l-.53 3.5h-2.79V24C19.61 23.1 24 18.1 24 12.07Z"/></svg>
        </span>
        <span class="label">Continue with Facebook</span>
        <span class="spinner" aria-hidden="true"></span>
        <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
      </button>

      <button class="provider-btn" data-provider="apple" type="button">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path fill="#ffffff" d="M16.36 1.64c.1 1.08-.32 2.15-1 2.93-.7.8-1.83 1.42-2.93 1.34-.12-1.05.38-2.16 1.02-2.9.72-.82 1.96-1.43 2.9-1.37ZM20.6 17.2c-.35.8-.77 1.55-1.28 2.25-.7.98-1.27 1.65-1.7 2.02-.66.6-1.37.9-2.13.92-.55.01-1.2-.15-1.96-.48-.77-.33-1.47-.49-2.13-.49-.68 0-1.4.16-2.16.49-.77.33-1.4.5-1.9.52-.73.03-1.46-.28-2.18-.94-.46-.4-1.06-1.1-1.8-2.1-.8-1.07-1.45-2.31-1.97-3.73-.55-1.53-.83-3.02-.83-4.45 0-1.64.35-3.06 1.06-4.24a6.24 6.24 0 0 1 2.23-2.26 5.99 5.99 0 0 1 3.02-.85c.6 0 1.4.19 2.4.55.99.37 1.63.55 1.92.55.21 0 .93-.21 2.13-.63 1.14-.39 2.11-.55 2.9-.49 2.14.17 3.75 1.02 4.82 2.55-1.92 1.16-2.87 2.79-2.85 4.87.02 1.63.6 2.98 1.75 4.05.52.5 1.1.88 1.75 1.15-.14.4-.29.78-.46 1.16Z"/></svg>
        </span>
        <span class="label">Continue with Apple</span>
        <span class="spinner" aria-hidden="true"></span>
        <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
      </button>

      <button class="provider-btn" data-provider="x" type="button">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path fill="#ffffff" d="M18.24 2H21l-6.52 7.46L22.2 22h-6.02l-4.71-6.17L5.06 22H2.3l6.98-7.98L1.5 2h6.17l4.26 5.64L18.24 2Zm-1.06 18.17h1.67L7.9 3.73H6.1l11.08 16.44Z"/></svg>
        </span>
        <span class="label">Continue with X</span>
        <span class="spinner" aria-hidden="true"></span>
        <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
      </button>

      <button class="provider-btn" data-provider="vk" type="button">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path fill="#0077FF" d="M2 11.53C2 6.4 2 3.84 3.6 2.22 5.2.6 7.76.6 12.9.6h.2c5.13 0 7.69 0 9.29 1.62C24 3.84 24 6.4 24 11.53v.94c0 5.13 0 7.7-1.6 9.31-1.61 1.62-4.17 1.62-9.3 1.62h-.2c-5.13 0-7.69 0-9.3-1.62C2 20.17 2 17.6 2 12.47v-.94Z"/><path fill="#fff" d="M12.79 17.29c-5.04 0-7.92-3.46-8.04-9.22h2.55c.08 4.19 1.94 5.96 3.4 6.33V8.07h2.4v3.65c1.45-.16 2.97-1.8 3.48-3.65h2.4c-.39 2.28-2.03 3.92-3.19 4.6 1.16.55 3.03 1.98 3.74 4.62h-2.64c-.55-1.77-1.94-3.14-3.79-3.32v3.32h-.31Z"/></svg>
        </span>
        <span class="label">Continue with VK</span>
        <span class="spinner" aria-hidden="true"></span>
        <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
      </button>

    </div>

    <div class="divider">secure sign-in</div>

    <p class="terms">By continuing, you agree to our <a href="/terms">Terms</a> and <a href="/privacy">Privacy Policy</a>.</p>
  </main>

  <script>
    // ---------------------------------------------------------------
    // Login-selection page logic.
    //
    // This file NEVER builds a provider's OAuth authorization URL,
    // never touches a client secret, and never asks for a password.
    // It only tells the backend "the user picked <provider>" and lets
    // the backend (server/server.js) redirect to that provider's real,
    // official OAuth endpoint with the server's own client ID, PKCE
    // challenge and CSRF state. See README.md for setup.
    // ---------------------------------------------------------------

    const buttons = document.querySelectorAll(".provider-btn");
    const errorBanner = document.getElementById("errorBanner");
    const errorText = document.getElementById("errorText");

    function showError(message) {
      errorText.textContent = message || "Authentication failed. Please try again.";
      errorBanner.classList.add("show");
    }

    function clearError() {
      errorBanner.classList.remove("show");
    }

    function setLoading(btn, isLoading) {
      btn.classList.toggle("loading", isLoading);
      buttons.forEach((b) => { if (b !== btn) b.disabled = isLoading; });
    }

    buttons.forEach((btn) => {
      btn.addEventListener("click", async () => {
        clearError();
        const provider = btn.dataset.provider;
        setLoading(btn, true);

        try {
          // The backend redirects the browser straight to the provider's
          // official authorization endpoint — this fetch is only used to
          // fail fast (e.g. provider not configured on the server) before
          // we navigate away.
          const res = await fetch(`/auth/${provider}/start`, {
            method: "GET",
            headers: { "Accept": "application/json" },
          });

          if (!res.ok) {
            const data = await res.json().catch(() => ({}));
            throw new Error(data.message || "This sign-in option is unavailable right now.");
          }

          const data = await res.json();
          if (!data.authorizationUrl) {
            throw new Error("Could not start sign-in. Please try again.");
          }

          // Full-page navigation to the provider's real login screen.
          window.location.href = data.authorizationUrl;
        } catch (err) {
          setLoading(btn, false);
          showError(err.message);
        }
      });
    });

    // Surface errors the backend attaches after a failed/cancelled callback,
    // e.g. /?error=access_denied — never render raw provider error payloads.
    const params = new URLSearchParams(window.location.search);
    if (params.get("error")) {
      showError("Sign-in was cancelled or could not be completed.");
      // Clean the URL so a refresh doesn't re-trigger the banner.
      window.history.replaceState({}, "", window.location.pathname);
    }
  </script>
</body>
</html>
