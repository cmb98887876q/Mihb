<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Sequence - YouTube Ready</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body { background: #0a0a0a; color: #fff; min-height: 100vh; padding: 30px 16px; }
  .container { max-width: 560px; margin: 0 auto; }
  h1 { text-align: center; font-size: 26px; font-weight: 700; letter-spacing: 1.5px; margin-bottom: 6px; }
  .subtitle { text-align: center; color: #999; font-size: 14px; margin-bottom: 28px; }

  .slot {
    background: #151515;
    border: 1px solid #2a2a2a;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 16px;
    position: relative;
  }
  .slot-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .slot-title { font-weight: 600; font-size: 15px; color: #ddd; }
  .remove-btn {
    background: #331111; color: #ff6666; border: none; border-radius: 8px;
    padding: 5px 12px; font-size: 13px; cursor: pointer;
  }
  .remove-btn:hover { background: #441111; }

  .upload-box {
    background: #1a1a1a; border: 2px dashed #3a3a3a; border-radius: 12px;
    height: 140px; display: flex; flex-direction: column; justify-content: center;
    align-items: center; cursor: pointer; position: relative; overflow: hidden;
    transition: 0.25s;
  }
  .upload-box:hover, .upload-box.dragover { border-color: #666; background: #222; }
  .upload-box img { width: 100%; height: 100%; object-fit: cover; position: absolute; top:0; left:0; }
  .upload-label { text-align: center; z-index: 1; pointer-events: none; }
  .upload-label .title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  .upload-label .hint { font-size: 13px; color: #777; }

  .name-label { margin: 12px 0 6px 2px; font-size: 13px; color: #aaa; font-weight: 600; }
  .name-input {
    width: 100%; background: #1a1a1a; border: 1px solid #333; border-radius: 9px;
    padding: 11px 14px; color: #fff; font-size: 14px; outline: none;
  }
  .name-input:focus { border-color: #555; }

  .add-btn {
    width: 100%; padding: 14px; border: 2px dashed #444; border-radius: 12px;
    background: transparent; color: #aaa; font-size: 15px; font-weight: 600;
    cursor: pointer; margin-bottom: 24px; transition: 0.2s;
  }
  .add-btn:hover { border-color: #666; color: #fff; background: #1a1a1a; }

  .controls {
    background: #151515; border-radius: 14px; padding: 20px; margin-bottom: 20px;
  }
  .duration-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 14px; color: #bbb; }
  .duration-value { font-weight: 600; color: #fff; }
  input[type="range"] {
    width: 100%; height: 5px; -webkit-appearance: none; background: #333;
    border-radius: 3px; outline: none; margin-bottom: 22px;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 18px; height: 18px; background: #fff;
    border-radius: 50%; cursor: pointer;
  }

  .btn {
    width: 100%; padding: 15px; border: none; border-radius: 11px;
    font-size: 15px; font-weight: 600; cursor: pointer; margin-bottom: 10px;
    transition: 0.15s;
  }
  .btn:active { transform: scale(0.98); }
  .btn-start { background: #fff; color: #000; }
  .btn-record { background: #e63939; color: #fff; }
  .btn-record:hover { background: #ff4d4d; }
  .btn-reset { background: #2a2a2a; color: #ddd; }
  .btn-reset:hover { background: #333; }

  .status { text-align: center; font-size: 13px; color: #888; margin-top: 8px; min-height: 20px; }

  /* ===== ANIMATION / RECORD OVERLAY ===== */
  #overlay {
    position: fixed; inset: 0; background: #000; z-index: 9999;
    display: none; justify-content: center; align-items: center; flex-direction: column;
  }
  #overlay.active { display: flex; }

  .player-wrap {
    position: relative;
    width: 90%;
    max-width: 1280px;
    aspect-ratio: 16/9;
    background: #111;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.8);
  }

  #animCanvas {
    width: 100%;
    height: 100%;
    display: block;
    background: #000;
  }

  .anim-number {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%) scale(0.5);
    font-size: 160px; font-weight: 800; color: #fff; opacity: 0;
    transition: all 0.5s cubic-bezier(0.22,1,0.36,1); z-index: 5; pointer-events: none;
  }
  .anim-number.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }

  .close-btn {
    position: absolute; top: 18px; right: 18px;
    background: rgba(255,255,255,0.15); border: none; color: #fff;
    width: 44px; height: 44px; border-radius: 50%; font-size: 20px; cursor: pointer; z-index: 20;
  }
  .close-btn:hover { background: rgba(255,255,255,0.25); }

  .recording-badge {
    position: absolute; top: 18px; left: 18px;
    background: #e63939; color: #fff; padding: 6px 14px; border-radius: 20px;
    font-size: 13px; font-weight: 600; display: none; z-index: 20;
  }
</style>
</head>
<body>

<div class="container">
  <h1>IMAGE SEQUENCE</h1>
  <p class="subtitle">YouTube ready • Multi image • Record video</p>

  <div id="slots"></div>

  <button class="add-btn" onclick="addSlot()">+ Add Image</button>

  <div class="controls">
    <div class="duration-row">
      <span>Image Duration</span>
      <span class="duration-value" id="durationValue">3.5s</span>
    </div>
    <input type="range" id="duration" min="1.5" max="8" value="3.5" step="0.5">

    <button class="btn btn-start" onclick="startPreview()">▶ Preview Animation</button>
    <button class="btn btn-record" onclick="startRecording()">● Record Video (YouTube)</button>
    <button class="btn btn-reset" onclick="resetAll()">Reset All</button>
    <div class="status" id="status"></div>
  </div>
</div>

<!-- Overlay -->
<div id="overlay">
  <button class="close-btn" onclick="stopEverything()">✕</button>
  <div class="recording-badge" id="recBadge">● REC</div>
  <div class="player-wrap">
    <canvas id="animCanvas" width="1280" height="720"></canvas>
    <div class="anim-number" id="animNumber"></div>
  </div>
</div>

<script>
  // ============ STATE ============
  let slots = [];          // { id, imgSrc, name }
  let nextId = 1;
  let isPlaying = false;
  let isRecording = false;
  let mediaRecorder = null;
  let recordedChunks = [];
  let timeouts = [];
  let animFrameId = null;

  const canvas = document.getElementById('animCanvas');
  const ctx = canvas.getContext('2d');
  const W = 1280, H = 720;

  // ============ UI SLOTS ============
  function addSlot(prefill = null) {
    const id = nextId++;
    const data = prefill || { id, imgSrc: null, name: '' };
    slots.push(data);

    const div = document.createElement('div');
    div.className = 'slot';
    div.id = `slot-${id}`;
    div.innerHTML = `
      <div class="slot-header">
        <div class="slot-title">IMAGE ${slots.length}</div>
        <button class="remove-btn" onclick="removeSlot(${id})">Remove</button>
      </div>
      <div class="upload-box" id="box-${id}">
        <div class="upload-label" id="label-${id}">
          <div class="title">Click or Drop</div>
          <div class="hint">PNG / JPG</div>
        </div>
        <img id="preview-${id}" style="display:none">
        <input type="file" id="file-${id}" accept="image/*" hidden>
      </div>
      <div class="name-label">NAME</div>
      <input type="text" class="name-input" id="name-\( {id}" placeholder="Character name..." value=" \){data.name || ''}">
    `;
    document.getElementById('slots').appendChild(div);

    // events
    const box = document.getElementById(`box-${id}`);
    const fileInput = document.getElementById(`file-${id}`);
    const preview = document.getElementById(`preview-${id}`);
    const label = document.getElementById(`label-${id}`);

    box.onclick = () => fileInput.click();
    fileInput.onchange = e => {
      const f = e.target.files[0];
      if (f) loadImg(f, id, preview, label);
    };
    box.ondragover = e => { e.preventDefault(); box.classList.add('dragover'); };
    box.ondragleave = () => box.classList.remove('dragover');
    box.ondrop = e => {
      e.preventDefault(); box.classList.remove('dragover');
      const f = e.dataTransfer.files[0];
      if (f && f.type.startsWith('image/')) loadImg(f, id, preview, label);
    };

    // name change
    document.getElementById(`name-${id}`).oninput = e => {
      const s = slots.find(x => x.id === id);
      if (s) s.name = e.target.value;
    };

    updateSlotTitles();
  }

  function loadImg(file, id, preview, label) {
    const reader = new FileReader();
    reader.onload = e => {
      preview.src = e.target.result;
      preview.style.display = 'block';
      label.style.display = 'none';
      const s = slots.find(x => x.id === id);
      if (s) s.imgSrc = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function removeSlot(id) {
    if (slots.length <= 1) { alert('At least 1 image chahiye'); return; }
    slots = slots.filter(s => s.id !== id);
    document.getElementById(`slot-${id}`).remove();
    updateSlotTitles();
  }

  function updateSlotTitles() {
    document.querySelectorAll('.slot').forEach((el, i) => {
      el.querySelector('.slot-title').textContent = `IMAGE ${i + 1}`;
    });
  }

  // start with 2 slots
  addSlot();
  addSlot();

  // duration
  const durationSlider = document.getElementById('duration');
  const durationValue = document.getElementById('durationValue');
  durationSlider.oninput = () => durationValue.textContent = durationSlider.value + 's';

  // ============ DRAW HELPERS ============
  function clearCanvas() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
  }

  function drawNumber(num) {
    clearCanvas();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 220px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(num), W/2, H/2);
  }

  function drawImageWithName(imgSrc, name) {
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        clearCanvas();
        // cover fit (YouTube style)
        const scale = Math.max(W / img.width, H / img.height);
        const sw = img.width * scale;
        const sh = img.height * scale;
        const ox = (W - sw) / 2;
        const oy = (H - sh) / 2;
        ctx.drawImage(img, ox, oy, sw, sh);

        // name in exact center
        if (name && name.trim()) {
          ctx.fillStyle = 'rgba(0,0,0,0.35)';
          ctx.fillRect(0, H/2 - 60, W, 120);

          ctx.fillStyle = '#fff';
          ctx.font = 'bold 72px Arial';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.shadowColor = 'rgba(0,0,0,0.9)';
          ctx.shadowBlur = 18;
          ctx.fillText(name.trim().toUpperCase(), W/2, H/2);
          ctx.shadowBlur = 0;
        }
        resolve();
      };
      img.src = imgSrc;
    });
  }

  // ============ PLAY SEQUENCE ============
  async function playSequence(recordMode = false) {
    const valid = slots.filter(s => s.imgSrc);
    if (valid.length < 1) {
      alert('Kam se kam 1 image upload karo');
      return;
    }

    isPlaying = true;
    document.getElementById('overlay').classList.add('active');
    document.getElementById('status').textContent = recordMode ? 'Recording...' : 'Playing...';
    if (recordMode) document.getElementById('recBadge').style.display = 'block';

    const dur = parseFloat(durationSlider.value) * 1000;
    const numberTime = 900;

    clearTimeouts();

    for (let i = 0; i < valid.length; i++) {
      // show number
      drawNumber(i + 1);
      await wait(numberTime);

      // show image + name
      await drawImageWithName(valid[i].imgSrc, valid[i].name || `IMAGE ${i+1}`);
      await wait(dur);
    }

    // end
    await wait(400);
    stopEverything();
  }

  function wait(ms) {
    return new Promise(r => {
      const t = setTimeout(r, ms);
      timeouts.push(t);
    });
  }

  function clearTimeouts() {
    timeouts.forEach(t => clearTimeout(t));
    timeouts = [];
  }

  // ============ PREVIEW ============
  function startPreview() {
    if (isPlaying) return;
    playSequence(false);
  }

  // ============ RECORD ============
  async function startRecording() {
    if (isPlaying || isRecording) return;

    const valid = slots.filter(s => s.imgSrc);
    if (valid.length < 1) {
      alert('Kam se kam 1 image upload karo');
      return;
    }

    // setup MediaRecorder on canvas stream
    const stream = canvas.captureStream(30); // 30 fps
    recordedChunks = [];

    // try best mime
    const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') 
      ? 'video/webm;codecs=vp9' 
      : 'video/webm';

    mediaRecorder = new MediaRecorder(stream, {
      mimeType: mime,
      videoBitsPerSecond: 8000000 // 8 Mbps good for YouTube
    });

    mediaRecorder.ondataavailable = e => {
      if (e.data.size > 0) recordedChunks.push(e.data);
    };

    mediaRecorder.onstop = () => {
      const blob = new Blob(recordedChunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `image-sequence-${Date.now()}.webm`;
      a.click();
      URL.revokeObjectURL(url);
      document.getElementById('status').textContent = 'Video downloaded! YouTube pe upload karo.';
      setTimeout(() => document.getElementById('status').textContent = '', 4000);
    };

    isRecording = true;
    mediaRecorder.start(100); // collect every 100ms
    await playSequence(true);
  }

  function stopEverything() {
    isPlaying = false;
    clearTimeouts();
    document.getElementById('overlay').classList.remove('active');
    document.getElementById('recBadge').style.display = 'none';
    document.getElementById('status').textContent = '';

    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      mediaRecorder.stop();
    }
    isRecording = false;
  }

  function resetAll() {
    stopEverything();
    slots = [];
    document.getElementById('slots').innerHTML = '';
    nextId = 1;
    addSlot();
    addSlot();
    durationSlider.value = 3.5;
    durationValue.textContent = '3.5s';
  }
</script>
</body>
</html>
