<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkSwift | Professional URL Shortener</title>
    
    <!-- Firebase SDKs (Compat Version for ease of use in single file) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #22c55e;
            --danger: #ef4444;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        [data-theme="dark"] {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; transition: background 0.3s; }

        body { background-color: var(--bg-body); color: var(--text-main); min-height: 100vh; }

        /* Redirect Screen */
        #redirect-screen {
            position: fixed; inset: 0; background: var(--bg-body);
            display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 9999;
        }

        .app-container { display: flex; min-height: 100vh; }

        /* Sidebar */
        aside {
            width: 260px; background: var(--bg-card); border-right: 1px solid var(--border);
            padding: 2rem 1.5rem; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh;
        }

        .logo { font-size: 1.5rem; font-weight: 700; color: var(--primary); margin-bottom: 2rem; display: flex; align-items: center; gap: 10px; }

        /* Main Area */
        main { flex: 1; padding: 2rem; max-width: 1200px; margin: 0 auto; width: 100%; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .stat-card { background: var(--bg-card); padding: 1.5rem; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); }
        .stat-card h3 { font-size: 0.875rem; color: var(--text-muted); margin-bottom: 0.5rem; }
        .stat-card p { font-size: 1.5rem; font-weight: 700; }

        /* Components */
        .card { background: var(--bg-card); padding: 2rem; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); margin-bottom: 2rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem; }
        input { width: 100%; padding: 0.75rem 1rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-body); color: var(--text-main); outline: none; }
        input:focus { border-color: var(--primary); }

        .btn { padding: 0.75rem 1.5rem; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-main); }
        .btn-danger { background: var(--danger); color: white; }

        /* Table */
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th { text-align: left; padding: 1rem; border-bottom: 2px solid var(--border); color: var(--text-muted); font-size: 0.875rem; }
        td { padding: 1rem; border-bottom: 1px solid var(--border); font-size: 0.875rem; }
        .short-code-badge { background: rgba(99, 102, 241, 0.1); color: var(--primary); padding: 4px 8px; border-radius: 4px; font-weight: 600; font-family: monospace; }

        /* Modal */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(4px); }
        .modal-content { background: var(--bg-card); padding: 2rem; border-radius: var(--radius); width: 90%; max-width: 500px; }

        /* Toast */
        #toast-container { position: fixed; bottom: 2rem; right: 2rem; z-index: 9999; }
        .toast { background: var(--bg-card); border-left: 4px solid var(--primary); padding: 1rem 1.5rem; box-shadow: 0 10px 15px rgba(0,0,0,0.1); border-radius: 4px; margin-top: 0.5rem; animation: slideIn 0.3s; }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }

        .spinner { width: 40px; height: 40px; border: 4px solid var(--border); border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .app-container { flex-direction: column; }
            aside { width: 100%; height: auto; position: relative; }
            table thead { display: none; }
            table tr { display: block; border: 1px solid var(--border); margin-bottom: 1rem; padding: 10px; border-radius: 8px; }
            table td { display: flex; justify-content: space-between; border: none; padding: 5px 0; }
            table td::before { content: attr(data-label); font-weight: bold; color: var(--text-muted); }
        }
    </style>
</head>
<body>

    <div id="redirect-screen">
        <div class="spinner"></div>
        <p style="margin-top: 20px;">Redirecting to destination...</p>
        <p id="redirect-status" style="color: var(--text-muted); margin-top: 10px;"></p>
    </div>

    <div class="app-container" id="app-shell">
        <aside>
            <div class="logo">LinkSwift</div>
            <nav style="flex: 1;">
                <p style="color: var(--text-muted); font-size: 0.7rem; font-weight: 800; text-transform: uppercase; margin-bottom: 1rem;">Menu</p>
                <div style="color: var(--primary); font-weight: 600;">Dashboard</div>
            </nav>
            <button class="btn btn-outline" onclick="toggleTheme()" id="theme-btn">Dark Mode</button>
        </aside>

        <main>
            <div class="stats-grid">
                <div class="stat-card"><h3>Total Links</h3><p id="stat-total">0</p></div>
                <div class="stat-card"><h3>Total Clicks</h3><p id="stat-clicks">0</p></div>
                <div class="stat-card"><h3>Active Now</h3><p id="stat-active">0</p></div>
            </div>

            <div class="card">
                <h2 style="margin-bottom: 1.5rem;">Create Short Link</h2>
                <div style="display: grid; grid-template-columns: 1fr 200px auto; gap: 1rem; align-items: end;">
                    <div class="form-group" style="margin:0">
                        <label>Original URL</label>
                        <input type="url" id="input-url" placeholder="https://example.com/long-page">
                    </div>
                    <div class="form-group" style="margin:0">
                        <label>Custom Code (Opt)</label>
                        <input type="text" id="input-code" placeholder="promo2024">
                    </div>
                    <button class="btn btn-primary" onclick="createLink()">Shorten</button>
                </div>
            </div>

            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <h2>Link Management</h2>
                    <input type="text" id="search-input" placeholder="Search links..." style="width: 250px;" oninput="renderTable()">
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Short Code</th>
                                <th>Original URL</th>
                                <th>Clicks</th>
                                <th>Date</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="links-table-body"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Edit Modal -->
    <div class="modal" id="edit-modal">
        <div class="modal-content">
            <h2>Edit Destination</h2>
            <p style="margin: 10px 0; color: var(--text-muted);">Short Code: <span id="edit-code-label" class="short-code-badge"></span></p>
            <div class="form-group">
                <label>New Original URL</label>
                <input type="url" id="edit-url-input">
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
                <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" id="save-edit-btn">Save Changes</button>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script>
        // FIREBASE CONFIGURATION
        const firebaseConfig = { 
            apiKey: "AIzaSyDzZf-VbpRE65xIhAqObqKECucp9Pp2EDg", 
            authDomain: "app-stor-f8cd2.firebaseapp.com", 
            databaseURL: "https://app-stor-f8cd2-default-rtdb.firebaseio.com", 
            projectId: "app-stor-f8cd2" 
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let allLinks = [];

        // REDIRECTION LOGIC
        async function checkRedirect() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('s');
            if (code) {
                document.getElementById('app-shell').style.display = 'none';
                document.getElementById('redirect-screen').style.display = 'flex';
                try {
                    const snap = await db.ref('links/' + code).once('value');
                    const data = snap.val();
                    if (data) {
                        await db.ref('links/' + code).update({ clicks: (data.clicks || 0) + 1 });
                        window.location.href = data.originalUrl;
                    } else {
                        document.getElementById('redirect-status').innerText = "Link not found.";
                    }
                } catch (e) { document.getElementById('redirect-status').innerText = "Error connecting to database."; }
                return true;
            }
            return false;
        }

        // CREATE
        async function createLink() {
            const url = document.getElementById('input-url').value.trim();
            let code = document.getElementById('input-code').value.trim();
            
            if (!url.startsWith('http')) return showToast("Enter a valid HTTP/HTTPS URL", "danger");
            if (!code) code = Math.random().toString(36).substring(2, 8).toUpperCase();

            const snap = await db.ref('links/' + code).once('value');
            if (snap.exists()) return showToast("Short code already taken", "danger");

            const newLink = {
                shortCode: code,
                originalUrl: url,
                clicks: 0,
                createdAt: Date.now(),
                updatedAt: Date.now()
            };

            await db.ref('links/' + code).set(newLink);
            showToast("Link created!");
            document.getElementById('input-url').value = '';
            document.getElementById('input-code').value = '';
        }

        // UPDATE (DYNAMIC EDIT)
        async function saveEdit(code) {
            const newUrl = document.getElementById('edit-url-input').value.trim();
            if (!newUrl.startsWith('http')) return showToast("Invalid URL", "danger");

            // We update ONLY originalUrl and updatedAt. 
            // The shortCode (the key) and clicks remain untouched.
            await db.ref('links/' + code).update({
                originalUrl: newUrl,
                updatedAt: Date.now()
            });

            showToast("Destination updated successfully!");
            closeModal();
        }

        // UI HELPERS
        function fetchLinks() {
            db.ref('links').on('value', (snap) => {
                const data = snap.val();
                allLinks = data ? Object.values(data) : [];
                allLinks.sort((a,b) => b.updatedAt - a.updatedAt);
                renderTable();
                updateStats();
            });
        }

        function renderTable() {
            const tbody = document.getElementById('links-table-body');
            const search = document.getElementById('search-input').value.toLowerCase();
            const filtered = allLinks.filter(l => l.shortCode.toLowerCase().includes(search) || l.originalUrl.toLowerCase().includes(search));

            tbody.innerHTML = filtered.map(l => `
                <tr>
                    <td data-label="Short Code"><span class="short-code-badge">${l.shortCode}</span></td>
                    <td data-label="Original URL" style="max-width:200px; overflow:hidden; text-overflow:ellipsis;">${l.originalUrl}</td>
                    <td data-label="Clicks"><strong>${l.clicks}</strong></td>
                    <td data-label="Date">${new Date(l.updatedAt).toLocaleDateString()}</td>
                    <td data-label="Actions">
                        <button class="btn btn-outline" style="padding:5px" onclick="copyLink('${l.shortCode}')">Copy</button>
                        <button class="btn btn-outline" style="padding:5px" onclick="openEdit('${l.shortCode}', '${l.originalUrl}')">Edit</button>
                        <button class="btn btn-outline" style="padding:5px; color:red" onclick="deleteLink('${l.shortCode}')">Del</button>
                    </td>
                </tr>
            `).join('');
        }

        function updateStats() {
            document.getElementById('stat-total').innerText = allLinks.length;
            document.getElementById('stat-clicks').innerText = allLinks.reduce((a, b) => a + (b.clicks || 0), 0);
            document.getElementById('stat-active').innerText = allLinks.length;
        }

        function copyLink(code) {
            const url = window.location.origin + window.location.pathname + "?s=" + code;
            navigator.clipboard.writeText(url);
            showToast("Copied to clipboard!");
        }

        function openEdit(code, url) {
            document.getElementById('edit-code-label').innerText = code;
            document.getElementById('edit-url-input').value = url;
            document.getElementById('edit-modal').style.display = 'flex';
            document.getElementById('save-edit-btn').onclick = () => saveEdit(code);
        }

        function closeModal() { document.getElementById('edit-modal').style.display = 'none'; }

        async function deleteLink(code) {
            if(confirm("Delete link?")) await db.ref('links/' + code).remove();
        }

        function showToast(m, type="success") {
            const c = document.getElementById('toast-container');
            const t = document.createElement('div');
            t.className = 'toast';
            if(type === "danger") t.style.borderLeftColor = "var(--danger)";
            t.innerText = m;
            c.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        function toggleTheme() {
            const theme = document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', theme);
            document.getElementById('theme-btn').innerText = theme === 'dark' ? 'Light Mode' : 'Dark Mode';
            localStorage.setItem('theme', theme);
        }

        window.onload = async () => {
            if (!(await checkRedirect())) {
                const savedTheme = localStorage.getItem('theme') || 'light';
                document.body.setAttribute('data-theme', savedTheme);
                fetchLinks();
            }
        }
    </script>
</body>
</html>
