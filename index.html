<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR PRO | Professional QR Generator</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Professional QR Engine -->
    <script type="text/javascript" src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    <!-- Alpine.js (State Management) -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        [x-cloak] { display: none !important; }
        .qr-gradient { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); }
        .glass-card { background: white; border: 1px solid #e2e8f0; border-radius: 1.5rem; }
        .qr-container-inner {
            min-height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            border-radius: 1rem;
            border: 1px dashed #e2e8f0;
        }
        .btn-primary { 
            background: #4f46e5; 
            color: white; 
            transition: all 0.2s;
        }
        .btn-primary:hover { background: #4338ca; transform: translateY(-1px); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen" x-data="qrApp()">

    <!-- Header -->
    <nav class="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 h-16 flex justify-between items-center">
            <div class="flex items-center gap-2 cursor-pointer" @click="resetGenerator()">
                <div class="p-2 qr-gradient rounded-lg text-white">
                    <i data-lucide="qr-code" class="w-6 h-6"></i>
                </div>
                <span class="font-bold text-xl tracking-tight">QR<span class="text-indigo-600">PRO</span></span>
            </div>
            <div class="flex gap-6">
                <button @click="view = 'generator'" :class="view === 'generator' ? 'text-indigo-600 border-b-2 border-indigo-600' : 'text-slate-500'" class="font-semibold py-5 transition-all">Generator</button>
                <button @click="view = 'history'" :class="view === 'history' ? 'text-indigo-600 border-b-2 border-indigo-600' : 'text-slate-500'" class="font-semibold py-5 transition-all">History</button>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 py-8">
        
        <!-- GENERATOR VIEW -->
        <div x-show="view === 'generator'" class="space-y-8 animate-in fade-in duration-500">
            
            <!-- Type Selector -->
            <div class="flex justify-center">
                <div class="bg-slate-200/50 p-1.5 rounded-2xl flex gap-1">
                    <button @click="switchType('link')" :class="currentQR.type === 'link' ? 'bg-white shadow-sm text-indigo-600' : 'text-slate-500 hover:text-slate-700'" class="px-8 py-2.5 rounded-xl font-bold transition-all flex items-center gap-2">
                        <i data-lucide="link" class="w-4 h-4"></i> Link
                    </button>
                    <button @click="switchType('message')" :class="currentQR.type === 'message' ? 'bg-white shadow-sm text-indigo-600' : 'text-slate-500 hover:text-slate-700'" class="px-8 py-2.5 rounded-xl font-bold transition-all flex items-center gap-2">
                        <i data-lucide="message-square" class="w-4 h-4"></i> Message
                    </button>
                </div>
            </div>

            <div class="grid lg:grid-cols-12 gap-8 items-start">
                
                <!-- LEFT: Inputs -->
                <div class="lg:col-span-7 space-y-6">
                    <div class="glass-card p-6 sm:p-8 shadow-sm">
                        <label class="block text-sm font-bold text-slate-400 uppercase tracking-widest mb-4" x-text="currentQR.type === 'link' ? 'Website URL' : 'Text Message'"></label>
                        
                        <template x-if="currentQR.type === 'link'">
                            <div class="relative">
                                <i data-lucide="globe" class="absolute left-4 top-4 text-slate-400 w-5 h-5"></i>
                                <input type="url" 
                                       x-model="currentQR.content" 
                                       @input="handleUpdate()"
                                       placeholder="https://example.com" 
                                       class="w-full pl-12 pr-4 py-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 text-lg transition-all">
                            </div>
                        </template>

                        <template x-if="currentQR.type === 'message'">
                            <textarea x-model="currentQR.content" 
                                      @input="handleUpdate()"
                                      rows="5" 
                                      placeholder="Type your message here..." 
                                      class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 text-lg transition-all"></textarea>
                        </template>

                        <div x-show="error" class="mt-4 p-3 bg-red-50 text-red-600 rounded-xl text-sm font-medium flex items-center gap-2">
                            <i data-lucide="alert-circle" class="w-4 h-4"></i>
                            <span x-text="error"></span>
                        </div>

                        <div class="mt-8 flex gap-3">
                            <button @click="resetGenerator()" class="px-6 py-4 border border-slate-200 rounded-2xl font-bold text-slate-600 hover:bg-slate-50 transition-all flex items-center gap-2">
                                <i data-lucide="refresh-ccw" class="w-4 h-4"></i> Clear All
                            </button>
                        </div>
                    </div>
                </div>

                <!-- RIGHT: Preview -->
                <div class="lg:col-span-5">
                    <div class="glass-card p-8 shadow-xl shadow-slate-200/50 text-center sticky top-24">
                        <div id="qr-canvas" class="qr-container-inner mb-6 relative overflow-hidden">
                            <div x-show="!currentQR.content || error" class="text-slate-300 flex flex-col items-center p-10">
                                <i data-lucide="scan" class="w-16 h-16 mb-4 opacity-20"></i>
                                <p class="text-sm font-medium">Enter data to generate QR</p>
                            </div>
                        </div>

                        <div x-show="currentQR.content && !error" x-cloak>
                            <div class="mb-6 pb-6 border-b border-slate-100">
                                <div class="flex items-center justify-center gap-2 text-green-600 mb-2">
                                    <i data-lucide="check-circle" class="w-4 h-4"></i>
                                    <span class="text-xs font-bold uppercase tracking-widest">QR Ready</span>
                                </div>
                                <p class="text-slate-700 font-medium truncate px-4" x-text="currentQR.content"></p>
                            </div>

                            <div class="grid grid-cols-2 gap-3 mb-4">
                                <button @click="download('png')" class="flex items-center justify-center gap-2 py-3.5 bg-indigo-600 text-white rounded-2xl font-bold hover:bg-indigo-700 transition-all">
                                    <i data-lucide="download" class="w-4 h-4"></i> PNG
                                </button>
                                <button @click="download('svg')" class="flex items-center justify-center gap-2 py-3.5 bg-slate-800 text-white rounded-2xl font-bold hover:bg-black transition-all">
                                    <i data-lucide="file-type" class="w-4 h-4"></i> SVG
                                </button>
                            </div>

                            <button @click="copyContent()" class="w-full mb-3 flex items-center justify-center gap-2 py-3.5 border border-slate-200 text-slate-700 rounded-2xl font-bold hover:bg-slate-50 transition-all">
                                <i :data-lucide="copied ? 'check' : 'copy'" class="w-4 h-4" :class="copied ? 'text-green-500' : ''"></i>
                                <span x-text="copied ? 'Copied!' : 'Copy Content'"></span>
                            </button>

                            <button @click="saveToHistory()" class="w-full py-4 qr-gradient text-white rounded-2xl font-bold shadow-lg shadow-indigo-100 hover:opacity-90 transition-all flex items-center justify-center gap-2">
                                <i data-lucide="bookmark" class="w-5 h-5"></i>
                                <span>Save to History</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- HISTORY VIEW -->
        <div x-show="view === 'history'" x-cloak class="animate-in slide-in-from-bottom-4 duration-500">
            <div class="flex items-center justify-between mb-8">
                <div>
                    <h2 class="text-3xl font-bold text-slate-900">Your History</h2>
                    <p class="text-slate-500 mt-1">Saved locally in your browser</p>
                </div>
                <button @click="clearHistory()" x-show="history.length > 0" class="text-red-500 font-bold text-sm hover:underline">Delete All</button>
            </div>

            <template x-if="history.length === 0">
                <div class="text-center py-24 glass-card border-dashed">
                    <i data-lucide="history" class="w-16 h-16 mx-auto text-slate-200 mb-4"></i>
                    <h3 class="text-xl font-bold text-slate-800">No history found</h3>
                    <p class="text-slate-500 mb-6">QR codes you save will appear here.</p>
                    <button @click="view = 'generator'" class="btn-primary px-8 py-3 rounded-xl font-bold">Start Generating</button>
                </div>
            </template>

            <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                <template x-for="item in history" :key="item.id">
                    <div class="glass-card p-6 hover:shadow-md transition-all group border-slate-100">
                        <div class="flex justify-between items-start mb-4">
                            <div class="p-3 bg-indigo-50 text-indigo-600 rounded-xl">
                                <i :data-lucide="item.type === 'link' ? 'link' : 'message-square'" class="w-6 h-6"></i>
                            </div>
                            <span class="text-[10px] font-black text-slate-300 uppercase tracking-tighter" x-text="new Date(item.timestamp).toLocaleString()"></span>
                        </div>
                        <h4 class="font-bold text-slate-800 truncate mb-1" x-text="item.content"></h4>
                        <p class="text-xs text-slate-400 font-bold uppercase tracking-widest mb-6" x-text="item.type"></p>
                        
                        <div class="flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button @click="loadFromHistory(item)" class="flex-1 py-2.5 bg-slate-900 text-white rounded-lg text-xs font-bold">EDIT / REGEN</button>
                            <button @click="deleteItem(item.id)" class="px-3 py-2.5 text-red-500 hover:bg-red-50 rounded-lg"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </main>

    <script>
        function qrApp() {
            return {
                view: 'generator',
                currentQR: {
                    type: 'link',
                    content: ''
                },
                qrInstance: null,
                error: '',
                copied: false,
                history: JSON.parse(localStorage.getItem('qr_history') || '[]'),

                init() {
                    this.refreshIcons();
                },

                refreshIcons() {
                    setTimeout(() => lucide.createIcons(), 50);
                },

                switchType(type) {
                    this.currentQR.type = type;
                    this.currentQR.content = '';
                    this.error = '';
                    this.clearCanvas();
                    this.refreshIcons();
                },

                resetGenerator() {
                    this.currentQR.content = '';
                    this.currentQR.type = 'link';
                    this.error = '';
                    this.clearCanvas();
                    this.refreshIcons();
                },

                handleUpdate() {
                    this.validate();
                    this.generate();
                },

                validate() {
                    this.error = '';
                    const content = this.currentQR.content.trim();
                    if (!content) return false;

                    if (this.currentQR.type === 'link') {
                        const pattern = /^(https?:\/\/)?([\da-z.-]+)\.([a-z.]{2,6})([\/\w .-]*)*\/?$/;
                        if (!pattern.test(content)) {
                            this.error = 'Invalid URL format';
                            return false;
                        }
                    }
                    return true;
                },

                clearCanvas() {
                    const el = document.getElementById('qr-canvas');
                    if (el) el.innerHTML = '';
                    this.qrInstance = null;
                },

                generate() {
                    this.clearCanvas();
                    if (!this.currentQR.content.trim() || this.error) return;

                    // SINGLE SOURCE OF TRUTH GENERATION
                    this.qrInstance = new QRCodeStyling({
                        width: 280,
                        height: 280,
                        type: "svg",
                        data: this.currentQR.content,
                        dotsOptions: { color: "#4f46e5", type: "extra-rounded" },
                        backgroundOptions: { color: "#ffffff" },
                        cornersSquareOptions: { type: "extra-rounded", color: "#312e81" },
                        cornersDotOptions: { type: "dot", color: "#6366f1" }
                    });

                    this.qrInstance.append(document.getElementById('qr-canvas'));
                    this.refreshIcons();
                },

                async download(ext) {
                    if (this.qrInstance) {
                        this.qrInstance.download({ name: `QRPRO-${Date.now()}`, extension: ext });
                    }
                },

                copyContent() {
                    navigator.clipboard.writeText(this.currentQR.content);
                    this.copied = true;
                    setTimeout(() => this.copied = false, 2000);
                },

                // LOCAL HISTORY LOGIC
                saveToHistory() {
                    if (!this.currentQR.content || this.error) return;
                    
                    const newItem = {
                        id: Date.now(),
                        type: this.currentQR.type,
                        content: this.currentQR.content,
                        timestamp: new Date()
                    };

                    this.history.unshift(newItem);
                    localStorage.setItem('qr_history', JSON.stringify(this.history));
                    alert('Saved to History!');
                },

                loadFromHistory(item) {
                    this.view = 'generator';
                    this.currentQR.type = item.type;
                    this.currentQR.content = item.content;
                    this.handleUpdate();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                },

                deleteItem(id) {
                    this.history = this.history.filter(i => i.id !== id);
                    localStorage.setItem('qr_history', JSON.stringify(this.history));
                    this.refreshIcons();
                },

                clearHistory() {
                    if(confirm('Clear all saved items?')) {
                        this.history = [];
                        localStorage.removeItem('qr_history');
                    }
                }
            }
        }
    </script>
</body>
</html>
