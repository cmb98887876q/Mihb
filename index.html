<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>पुराने नगमे</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100vh;
      overflow: hidden;
      background: #111;
      color: white;
    }

    /* Background Image */
    .bg {
      position: fixed;
      inset: 0;
      background: url('https://images.unsplash.com/photo-1514525253161-7a46d19cd819?q=80&w=1974') center/cover no-repeat;
      filter: brightness(0.65);
      z-index: 0;
    }

    /* Soft vignette */
    .vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.7) 100%);
      z-index: 1;
      pointer-events: none;
    }

    /* Main Title */
    .title {
      position: absolute;
      top: 18%;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 10;
    }

    .title h1 {
      font-size: clamp(3rem, 9vw, 6.5rem);
      font-weight: 700;
      letter-spacing: 2px;
      text-shadow: 0 4px 30px rgba(0,0,0,0.8);
      line-height: 1.1;
    }

    .title p {
      margin-top: 12px;
      font-size: 1.1rem;
      opacity: 0.85;
      letter-spacing: 1px;
    }

    /* Player */
    .player {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      width: min(520px, 92%);
      background: rgba(20, 20, 20, 0.75);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 20;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    .album-art {
      width: 58px;
      height: 58px;
      border-radius: 14px;
      object-fit: cover;
      background: #333;
      flex-shrink: 0;
    }

    .info {
      flex: 1;
      min-width: 0;
    }

    .song-name {
      font-size: 1.05rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .artist {
      font-size: 0.85rem;
      opacity: 0.7;
      margin-top: 3px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      background: none;
      border: none;
      color: white;
      font-size: 1.4rem;
      cursor: pointer;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }

    .btn:hover {
      background: rgba(255,255,255,0.15);
    }

    .play-btn {
      background: white;
      color: #111;
      font-size: 1.2rem;
    }

    .play-btn:hover {
      transform: scale(1.08);
      background: #f0f0f0;
    }

    /* Progress bar */
    .progress-container {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: rgba(255,255,255,0.15);
      border-radius: 0 0 24px 24px;
      overflow: hidden;
      cursor: pointer;
    }

    .progress {
      height: 100%;
      width: 0%;
      background: #ff4d4d;
      transition: width 0.1s linear;
    }

    /* Hidden YouTube player */
    #yt-player {
      position: absolute;
      top: -9999px;
      left: -9999px;
    }
  </style>
</head>
<body>

  <div class="bg"></div>
  <div class="vignette"></div>

  <div class="title">
    <h1>पुराने नगमे</h1>
    <p>सदाबहार यादें • Old Hindi Classics</p>
  </div>

  <!-- Player UI -->
  <div class="player">
    <img src="https://i.ytimg.com/vi/8Yb5Y5Q5Z5Q/hqdefault.jpg" class="album-art" id="albumArt" alt="album">
    
    <div class="info">
      <div class="song-name" id="songName">O Mere Dil Ke Chain</div>
      <div class="artist" id="artist">Kishore Kumar</div>
    </div>

    <div class="controls">
      <button class="btn" onclick="prevSong()">⏮</button>
      <button class="btn play-btn" id="playBtn" onclick="togglePlay()">▶</button>
      <button class="btn" onclick="nextSong()">⏭</button>
    </div>

    <div class="progress-container" onclick="seek(event)">
      <div class="progress" id="progress"></div>
    </div>
  </div>

  <!-- Hidden YouTube Player -->
  <div id="yt-player"></div>

  <script>
    // ====== PLAYLIST (YouTube Video IDs) ======
    // Change these IDs with any YouTube songs you want
    const playlist = [
      {
        id: "8Yb5Y5Q5Z5Q", // example - replace with real IDs
        title: "O Mere Dil Ke Chain",
        artist: "Kishore Kumar",
        thumb: "https://i.ytimg.com/vi/8Yb5Y5Q5Z5Q/hqdefault.jpg"
      },
      {
        id: "yJg-Y5byMMw",
        title: "Tere Bina Zindagi Se",
        artist: "Kishore Kumar & Lata",
        thumb: "https://i.ytimg.com/vi/yJg-Y5byMMw/hqdefault.jpg"
      },
      {
        id: "lW1N3nB0x0A",
        title: "Pal Pal Dil Ke Paas",
        artist: "Kishore Kumar",
        thumb: "https://i.ytimg.com/vi/lW1N3nB0x0A/hqdefault.jpg"
      },
      {
        id: "5Eqb_-j3FDA",
        title: "Chura Liya Hai Tumne",
        artist: "Asha Bhosle & R.D. Burman",
        thumb: "https://i.ytimg.com/vi/5Eqb_-j3FDA/hqdefault.jpg"
      },
      {
        id: "K7Z7b8c8b8c", // replace this
        title: "Ek Ajnabee Haseena Se",
        artist: "Kishore Kumar",
        thumb: "https://i.ytimg.com/vi/K7Z7b8c8b8c/hqdefault.jpg"
      }
    ];

    let currentIndex = 0;
    let player;
    let isPlaying = false;

    // Load YouTube IFrame API
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.body.appendChild(tag);

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('yt-player', {
        height: '0',
        width: '0',
        videoId: playlist[0].id,
        playerVars: {
          autoplay: 0,
          controls: 0,
          rel: 0,
          modestbranding: 1
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerReady() {
      updateUI();
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.ENDED) {
        nextSong();
      }
      if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        document.getElementById('playBtn').innerHTML = '⏸';
        updateProgress();
      }
      if (event.data === YT.PlayerState.PAUSED) {
        isPlaying = false;
        document.getElementById('playBtn').innerHTML = '▶';
      }
    }

    function togglePlay() {
      if (!player) return;
      if (isPlaying) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    }

    function nextSong() {
      currentIndex = (currentIndex + 1) % playlist.length;
      loadSong();
    }

    function prevSong() {
      currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
      loadSong();
    }

    function loadSong() {
      const song = playlist[currentIndex];
      player.loadVideoById(song.id);
      updateUI();
      player.playVideo();
    }

    function updateUI() {
      const song = playlist[currentIndex];
      document.getElementById('songName').textContent = song.title;
      document.getElementById('artist').textContent = song.artist;
      document.getElementById('albumArt').src = song.thumb;
    }

    function updateProgress() {
      if (!player || !isPlaying) return;
      const current = player.getCurrentTime();
      const duration = player.getDuration();
      if (duration > 0) {
        const percent = (current / duration) * 100;
        document.getElementById('progress').style.width = percent + '%';
      }
      requestAnimationFrame(updateProgress);
    }

    function seek(e) {
      if (!player) return;
      const rect = e.currentTarget.getBoundingClientRect();
      const percent = (e.clientX - rect.left) / rect.width;
      const duration = player.getDuration();
      player.seekTo(duration * percent, true);
    }
  </script>
</body>
</html>
