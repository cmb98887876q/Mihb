<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR PRO | Edit & History</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="text/javascript" src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        [x-cloak] { display: none !important; }
        .qr-gradient { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); }
        .card { background: white; border: 1px solid #e2e8f0; border-radius: 1rem; transition: all 0.3s; }
        .card:hover { border-color: #6366f1; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .input-field { width: 100%; padding: 0.75rem; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 0.5rem; outline: none; transition: border 0.2s; }
        .input-field:focus { border-color: #6366f1; background: white; }
    </style>
</head>
<body x-data="qrApp()">

    <!-- Navigation -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 h-16 flex justify-between items-center">
            <div class="flex items-center gap-2 cursor-pointer" @click="view = 'generator'">
                <div class="p-2 qr-gradient rounded-lg text-white">
                    <i data-lucide="qr-code" class="w-6 h-6"></i>
                </div>
                <span class="font-bold text-xl tracking-tight">QR<span class="text-indigo-600">PRO</span></span>
            </div>
            <div class="flex gap-4">
                <button @click="view = 'generator'" :class="view === 'generator' ? 'text-indigo-600' : 'text-slate-500'" class="font-bold px-4 py-2 rounded-lg hover:bg-slate-50 transition-all">Generator</button>
                <button @click="view = 'history'" :class="view === 'history' ? 'text-indigo-600' : 'text-slate-500'" class="font-bold px-4 py-2 rounded-lg hover:bg-slate-50 transition-all">History</button>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 py-8">
        
        <!-- GENERATOR SECTION -->
        <div x-show="view === 'generator'" class="space-y-8">
            <div class="max-w-2xl mx-auto text-center">
                <h1 class="text-3xl font-extrabold text-slate-900 mb-2">Create New QR Code</h1>
                <p class="text-slate-500">Enter your link or message below to generate a professional QR.</p>
            </div>

            <div class="grid lg:grid-cols-12 gap-8">
                <!-- Inputs -->
                <div class="lg:col-span-7 bg-white p-8 rounded-3xl border border-slate-200 shadow-sm">
                    <div class="flex gap-2 mb-6">
                        <button @click="currentQR.type = 'link'; handleUpdate()" :class="currentQR.type === 'link' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'" class="px-6 py-2 rounded-full text-sm font-bold transition-all">Link</button>
                        <button @click="currentQR.type = 'message'; handleUpdate()" :class="currentQR.type === 'message' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'" class="px-6 py-2 rounded-full text-sm font-bold transition-all">Message</button>
                    </div>

                    <div class="space-y-4">
                        <label class="block text-xs font-black text-slate-400 uppercase tracking-widest" x-text="currentQR.type === 'link' ? 'Website URL' : 'Your Message'"></label>
                        <textarea x-model="currentQR.content" @input="handleUpdate()" rows="4" class="input-field text-lg" placeholder="Start typing..."></textarea>
                    </div>

                    <button @click="saveToHistory()" class="mt-8 w-full py-4 qr-gradient text-white rounded-2xl font-bold shadow-lg flex items-center justify-center gap-2 hover:opacity-90">
                        <i data-lucide="bookmark-plus" class="w-5 h-5"></i> Save to History
                    </button>
                </div>

                <!-- Preview -->
                <div class="lg:col-span-5 flex flex-col items-center">
                    <div id="main-qr-preview" class="bg-white p-6 rounded-3xl border border-slate-200 shadow-xl min-w-[320px] min-h-[320px] flex items-center justify-center">
                        <div x-show="!currentQR.content" class="text-slate-300 text-center">
                            <i data-lucide="layers" class="w-12 h-12 mx-auto mb-2 opacity-20"></i>
                            <p class="text-xs font-bold uppercase">Live Preview</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- HISTORY SECTION (WITH INLINE EDIT) -->
        <div x-show="view === 'history'" x-cloak>
            <div class="flex justify-between items-end mb-8">
                <div>
                    <h2 class="text-3xl font-black text-slate-900">History</h2>
                    <p class="text-slate-500">Manage and update your saved QR codes.</p>
                </div>
                <button @click="clearAllHistory()" class="text-red-500 text-sm font-bold hover:underline">Clear History</button>
            </div>

            <div x-show="history.length === 0" class="bg-white border-2 border-dashed border-slate-200 rounded-3xl py-20 text-center">
                <i data-lucide="folder-x" class="w-12 h-12 mx-auto text-slate-200 mb-4"></i>
                <p class="text-slate-400 font-medium">No items found in history.</p>
            </div>

            <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                <template x-for="(item, index) in history" :key="item.id">
                    <div class="card p-6 flex flex-col">
                        <!-- History Header -->
                        <div class="flex justify-between items-start mb-4">
                            <span class="text-[10px] font-black uppercase px-2 py-1 bg-slate-100 rounded text-slate-500" x-text="item.type"></span>
                            <span class="text-[10px] text-slate-300 font-bold" x-text="item.date"></span>
                        </div>

                        <!-- Content Area (View Mode or Edit Mode) -->
                        <div class="flex-grow">
                            <template x-if="editingId !== item.id">
                                <div>
                                    <p class="font-bold text-slate-800 break-all line-clamp-3 mb-4" x-text="item.content"></p>
                                </div>
                            </template>

                            <template x-if="editingId === item.id">
                                <div class="mb-4">
                                    <textarea x-model="editBuffer" class="input-field text-sm mb-2" rows="3"></textarea>
                                    <div class="flex gap-2">
                                        <button @click="saveEdit(item.id)" class="flex-1 bg-green-600 text-white py-2 rounded-lg text-xs font-bold">SAVE CHANGES</button>
                                        <button @click="editingId = null" class="bg-slate-200 text-slate-600 px-3 py-2 rounded-lg text-xs font-bold">CANCEL</button>
                                    </div>
                                </div>
                            </template>
                        </div>

                        <!-- Footer Actions -->
                        <div class="mt-4 pt-4 border-t border-slate-50 flex items-center justify-between">
                            <div class="flex gap-2">
                                <button @click="startEdit(item)" class="p-2 text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors" title="Edit Content">
                                    <i data-lucide="edit-3" class="w-4 h-4"></i>
                                </button>
                                <button @click="downloadItem(item)" class="p-2 text-slate-600 hover:bg-slate-50 rounded-lg transition-colors" title="Download">
                                    <i data-lucide="download" class="w-4 h-4"></i>
                                </button>
                            </div>
                            <button @click="deleteItem(item.id)" class="p-2 text-red-400 hover:text-red-600 rounded-lg transition-colors">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </main>

    <script>
        function qrApp() {
            return {
                view: 'generator',
                currentQR: { type: 'link', content: '' },
                history: JSON.parse(localStorage.getItem('qr_local_v2') || '[]'),
                mainQR: null,
                editingId: null,
                editBuffer: '',

                init() {
                    lucide.createIcons();
                },

                handleUpdate() {
                    this.generateMain();
                    setTimeout(() => lucide.createIcons(), 50);
                },

                generateMain() {
                    const container = document.getElementById('main-qr-preview');
                    container.innerHTML = '';
                    if (!this.currentQR.content.trim()) return;

                    this.mainQR = new QRCodeStyling(this.getOptions(this.currentQR.content));
                    this.mainQR.append(container);
                },

                getOptions(data) {
                    return {
                        width: 280,
                        height: 280,
                        data: data,
                        dotsOptions: { color: "#4f46e5", type: "extra-rounded" },
                        backgroundOptions: { color: "#ffffff" },
                        cornersSquareOptions: { type: "extra-rounded", color: "#312e81" }
                    };
                },

                saveToHistory() {
                    if (!this.currentQR.content.trim()) return;
                    const item = {
                        id: Date.now(),
                        type: this.currentQR.type,
                        content: this.currentQR.content,
                        date: new Date().toLocaleDateString()
                    };
                    this.history.unshift(item);
                    this.sync();
                    alert('Saved to History!');
                    this.currentQR.content = '';
                    this.generateMain();
                },

                // INLINE EDIT LOGIC
                startEdit(item) {
                    this.editingId = item.id;
                    this.editBuffer = item.content;
                    setTimeout(() => lucide.createIcons(), 50);
                },

                saveEdit(id) {
                    const index = this.history.findIndex(i => i.id === id);
                    if (index !== -1) {
                        this.history[index].content = this.editBuffer;
                        this.sync();
                    }
                    this.editingId = null;
                    alert('History Updated!');
                },

                deleteItem(id) {
                    if(confirm('Delete this record?')) {
                        this.history = this.history.filter(i => i.id !== id);
                        this.sync();
                    }
                },

                clearAllHistory() {
                    if(confirm('Wipe entire history?')) {
                        this.history = [];
                        this.sync();
                    }
                },

                downloadItem(item) {
                    const tempQR = new QRCodeStyling(this.getOptions(item.content));
                    tempQR.download({ name: 'qr-history', extension: 'png' });
                },

                sync() {
                    localStorage.setItem('qr_local_v2', JSON.stringify(this.history));
                    setTimeout(() => lucide.createIcons(), 50);
                }
            }
        }
    </script>
</body>
</html>
