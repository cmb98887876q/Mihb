<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>पुराने नगमे — कैसेट की दुकान</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Baloo+2:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-deep:#140f1c;
    --ink-mid:#241a2a;
    --ink-warm:#3a2420;
    --amber:#eda854;
    --amber-soft:#f6c987;
    --rust:#c8593f;
    --cream:#f3e6c8;
    --teal:#3f6e63;
    --teal-deep:#24413a;
    --glass:rgba(24,16,20,0.52);
    --glass-edge:rgba(243,230,200,0.14);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    width:100%; height:100%; overflow:hidden;
    background:var(--ink-deep);
    font-family:'Poppins',sans-serif;
  }
  .stage{
    position:fixed; inset:0; overflow:hidden;
  }

  /* ---------- SKY ---------- */
  .sky{
    position:absolute; inset:0;
    background:
      radial-gradient(120% 70% at 50% 100%, #7a3f34 0%, #4a2a3a 22%, #241a34 46%, #140f1c 78%),
      linear-gradient(180deg, #100b18 0%, #1c1428 40%, #2c1c2a 100%);
  }
  .sky::after{
    content:"";
    position:absolute; inset:0;
    background:radial-gradient(80% 55% at 50% 105%, rgba(232,160,76,0.28), transparent 70%);
  }

  .moon{
    position:absolute; top:8%; right:12%;
    width:min(11vw,90px); height:min(11vw,90px); border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff6df 0%, var(--amber-soft) 55%, var(--amber) 100%);
    box-shadow:0 0 60px 18px rgba(237,168,84,0.35), 0 0 140px 60px rgba(237,168,84,0.12);
    animation:moonGlow 6s ease-in-out infinite;
  }
  @keyframes moonGlow{
    0%,100%{box-shadow:0 0 60px 18px rgba(237,168,84,0.30), 0 0 140px 60px rgba(237,168,84,0.10);}
    50%{box-shadow:0 0 70px 24px rgba(237,168,84,0.45), 0 0 160px 70px rgba(237,168,84,0.18);}
  }

  .birds{ position:absolute; top:16%; left:8%; opacity:0.55; }
  .birds path{ stroke:var(--cream); stroke-width:1.4; fill:none; stroke-linecap:round; }

  /* ---------- STRING LIGHTS ---------- */
  .lights-wrap{ position:absolute; top:0; left:0; width:100%; height:16vh; }
  .bulb{
    position:absolute; width:7px; height:7px; border-radius:50%;
    background:var(--amber-soft);
    box-shadow:0 0 8px 3px rgba(246,201,135,0.85);
    animation:twinkle 3.2s ease-in-out infinite;
  }
  @keyframes twinkle{ 0%,100%{opacity:0.55; transform:scale(0.9);} 50%{opacity:1; transform:scale(1.15);} }

  /* ---------- SKYLINE ---------- */
  .skyline{
    position:absolute; bottom:0; left:0; width:100%;
  }
  .skyline svg{ width:100%; height:auto; display:block; }
  .win{ fill:var(--amber); opacity:0.85; animation:flicker 5s ease-in-out infinite; }
  @keyframes flicker{ 0%,88%,100%{opacity:0.85;} 90%{opacity:0.3;} 92%{opacity:0.85;} }

  /* ---------- SIGNBOARD ---------- */
  .signboard{
    position:absolute; top:20%; left:50%; transform:translateX(-50%);
    text-align:center; z-index:5; width:92%;
  }
  .signboard .eyebrow{
    font-family:'Baloo 2',sans-serif; font-weight:600; letter-spacing:0.35em;
    font-size:clamp(10px,1.4vw,13px); color:var(--amber-soft);
    text-transform:uppercase; opacity:0.85; margin-bottom:6px;
  }
  .signboard h1{
    font-family:'Yatra One',cursive; font-weight:400;
    font-size:clamp(42px,9vw,108px); line-height:1;
    color:var(--cream);
    text-shadow:
      0 2px 0 rgba(0,0,0,0.25),
      0 10px 26px rgba(0,0,0,0.55),
      0 0 40px rgba(237,168,84,0.25);
    letter-spacing:2px;
  }
  .signboard .tagline{
    margin-top:12px; font-family:'Baloo 2',sans-serif; font-weight:500;
    font-size:clamp(14px,2vw,20px); color:var(--amber-soft);
    text-shadow:0 2px 10px rgba(0,0,0,0.5);
    opacity:0.92;
  }
  .signboard .rule{
    width:120px; height:2px; margin:16px auto 0;
    background:linear-gradient(90deg, transparent, var(--amber), transparent);
    opacity:0.7;
  }

  /* ---------- FOREGROUND PROPS ---------- */
  .props{ position:absolute; bottom:0; left:0; width:100%; z-index:4; pointer-events:none; }
  .props svg{ width:100%; display:block; }

  /* ---------- DUST / GRAIN ---------- */
  .particles{ position:absolute; inset:0; z-index:6; pointer-events:none; overflow:hidden; }
  .mote{
    position:absolute; bottom:-10px; border-radius:50%;
    background:var(--amber-soft); opacity:0.5;
    animation-name:float-up; animation-timing-function:ease-in; animation-iteration-count:infinite;
  }
  @keyframes float-up{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    10%{ opacity:0.6; }
    90%{ opacity:0.35; }
    100%{ transform:translateY(-100vh) translateX(20px); opacity:0; }
  }

  .grain{
    position:absolute; inset:0; z-index:7; pointer-events:none;
    opacity:0.07; mix-blend-mode:overlay;
  }

  .vignette{
    position:absolute; inset:0; z-index:8; pointer-events:none;
    background:radial-gradient(120% 90% at 50% 45%, transparent 40%, rgba(10,7,12,0.55) 88%, rgba(8,5,9,0.85) 100%);
  }

  /* ---------- PLAYER ---------- */
  .player{
    position:fixed; left:50%; bottom:clamp(14px,3vh,32px); transform:translateX(-50%);
    z-index:20; width:min(94vw,460px);
    background:var(--glass);
    -webkit-backdrop-filter:blur(22px) saturate(140%);
    backdrop-filter:blur(22px) saturate(140%);
    border:1px solid var(--glass-edge);
    border-radius:26px;
    padding:16px 18px 14px;
    box-shadow:0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
  }
  .player-top{ display:flex; align-items:center; gap:14px; }

  .art-ring{
    position:relative; width:58px; height:58px; flex:none;
    border-radius:50%;
    background:conic-gradient(from 0deg, #2b2020, #5a3b2c, #2b2020);
    padding:4px;
    animation:spin 9s linear infinite; animation-play-state:paused;
  }
  .art-ring.spinning{ animation-play-state:running; }
  .art-ring img{
    width:100%; height:100%; border-radius:50%; object-fit:cover;
    border:2px solid var(--ink-deep);
    display:block;
  }
  .art-ring::after{
    content:""; position:absolute; top:50%; left:50%; width:10px; height:10px;
    background:var(--ink-deep); border-radius:50%; transform:translate(-50%,-50%);
    box-shadow:0 0 0 2px var(--amber-soft);
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .track-info{ min-width:0; flex:1; }
  .track-title{
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:16px;
    color:var(--cream); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .track-artist{
    font-family:'Poppins',sans-serif; font-weight:400; font-size:11.5px;
    color:var(--amber-soft); opacity:0.85; margin-top:2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  .shuffle-btn{
    flex:none; width:34px; height:34px; border-radius:50%; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    background:rgba(243,230,200,0.08); color:var(--cream); opacity:0.7;
    transition:all .2s ease;
  }
  .shuffle-btn.active{ background:var(--amber); color:var(--ink-deep); opacity:1; }
  .shuffle-btn:hover{ opacity:1; }

  .progress-row{ display:flex; align-items:center; gap:8px; margin-top:12px; }
  .time{ font-size:10px; color:var(--amber-soft); opacity:0.8; width:32px; font-variant-numeric:tabular-nums; }
  .time.right{ text-align:right; }
  .bar-track{
    flex:1; height:5px; border-radius:6px; background:rgba(243,230,200,0.15);
    cursor:pointer; position:relative; overflow:hidden;
  }
  .bar-fill{
    position:absolute; left:0; top:0; height:100%; width:0%;
    background:linear-gradient(90deg, var(--rust), var(--amber));
    border-radius:6px;
  }

  .controls-row{
    display:flex; align-items:center; justify-content:center; gap:22px; margin-top:12px;
  }
  .ctrl-btn{
    background:none; border:none; cursor:pointer; color:var(--cream);
    opacity:0.85; display:flex; align-items:center; justify-content:center;
    transition:transform .15s ease, opacity .15s ease;
  }
  .ctrl-btn:hover{ opacity:1; transform:scale(1.08); }
  .ctrl-btn:active{ transform:scale(0.92); }
  .play-btn{
    width:48px; height:48px; border-radius:50%;
    background:linear-gradient(160deg, var(--amber), var(--rust));
    color:var(--ink-deep); box-shadow:0 8px 20px rgba(200,89,63,0.45);
  }
  .play-btn:hover{ transform:scale(1.06); }

  #yt-player-container{ position:fixed; left:-9999px; top:-9999px; width:1px; height:1px; }

  @media (max-width:480px){
    .signboard{ top:16%; }
    .player{ padding:14px 14px 12px; border-radius:22px; }
  }
  @media (prefers-reduced-motion: reduce){
    .art-ring, .moon, .bulb, .mote, .win{ animation:none !important; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="sky"></div>

  <svg class="birds" width="140" height="40" viewBox="0 0 140 40">
    <path d="M2 20 Q10 8 18 20 Q26 8 34 20"/>
    <path d="M60 12 Q68 2 76 12 Q84 2 92 12"/>
    <path d="M100 26 Q107 17 114 26 Q121 17 128 26"/>
  </svg>

  <div class="moon"></div>

  <div class="lights-wrap" id="lightsWrap"></div>

  <div class="signboard">
    <div class="eyebrow">रील टू रील · कैसेट कॉर्नर</div>
    <h1>पुराने नगमे</h1>
    <div class="tagline">वो गलियाँ, वो शामें, वो गाने</div>
    <div class="rule"></div>
  </div>

  <div class="props">
    <svg viewBox="0 0 1440 220" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <!-- scooter silhouette -->
      <g fill="#0d0a10" opacity="0.9">
        <ellipse cx="120" cy="205" rx="18" ry="18"/>
        <ellipse cx="210" cy="205" rx="18" ry="18"/>
        <path d="M110 205 L130 160 L170 150 L210 205 L190 205 L175 170 L150 175 L140 205 Z"/>
        <rect x="155" y="120" width="6" height="35" rx="2"/>
        <rect x="130" y="118" width="46" height="8" rx="4"/>
      </g>
      <!-- stacked cassettes bottom right -->
      <g transform="translate(1230,150)">
        <rect x="0" y="0" width="90" height="20" rx="3" fill="#4a2f22"/>
        <rect x="6" y="-22" width="90" height="20" rx="3" fill="#c8593f" opacity="0.9"/>
        <rect x="-4" y="-44" width="90" height="20" rx="3" fill="#3f6e63" opacity="0.9"/>
        <circle cx="30" cy="-34" r="5" fill="#140f1c"/>
        <circle cx="66" cy="-34" r="5" fill="#140f1c"/>
      </g>
    </svg>
  </div>

  <svg class="skyline" viewBox="0 0 1440 260" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="bldg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#2a1c22"/>
        <stop offset="100%" stop-color="#140f1c"/>
      </linearGradient>
    </defs>
    <path d="M0,260 L0,150 L60,150 L60,110 L140,110 L140,150 L220,150 L220,90 L260,90 L260,150
      L340,150 L340,60 L420,60 L420,150 L520,150 L520,120 L600,120 L600,150 L720,150 L720,40
      L780,40 L780,150 L860,150 L860,95 L940,95 L940,150 L1020,150 L1020,70 L1100,70 L1100,150
      L1180,150 L1180,105 L1260,105 L1260,150 L1340,150 L1340,60 L1440,60 L1440,260 Z" fill="url(#bldg)"/>
    <!-- windows -->
    <g>
      <rect class="win" x="75" y="122" width="10" height="14"/>
      <rect class="win" x="100" y="122" width="10" height="14" style="animation-delay:0.6s"/>
      <rect class="win" x="235" y="106" width="10" height="14" style="animation-delay:1.2s"/>
      <rect class="win" x="355" y="80" width="10" height="14" style="animation-delay:1.8s"/>
      <rect class="win" x="385" y="100" width="10" height="14" style="animation-delay:0.3s"/>
      <rect class="win" x="435" y="90" width="10" height="14" style="animation-delay:2.4s"/>
      <rect class="win" x="465" y="120" width="10" height="14" style="animation-delay:1.5s"/>
      <rect class="win" x="615" y="132" width="10" height="14" style="animation-delay:0.9s"/>
      <rect class="win" x="740" y="62" width="10" height="14" style="animation-delay:2s"/>
      <rect class="win" x="740" y="90" width="10" height="14" style="animation-delay:0.4s"/>
      <rect class="win" x="875" y="112" width="10" height="14" style="animation-delay:1.1s"/>
      <rect class="win" x="1035" y="92" width="10" height="14" style="animation-delay:1.7s"/>
      <rect class="win" x="1035" y="120" width="10" height="14" style="animation-delay:0.2s"/>
      <rect class="win" x="1195" y="120" width="10" height="14" style="animation-delay:2.6s"/>
      <rect class="win" x="1355" y="85" width="10" height="14" style="animation-delay:1.3s"/>
      <rect class="win" x="1385" y="110" width="10" height="14" style="animation-delay:0.7s"/>
    </g>
  </svg>

  <div class="particles" id="particles"></div>

  <svg class="grain" xmlns="http://www.w3.org/2000/svg">
    <filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/></filter>
    <rect width="100%" height="100%" filter="url(#noiseFilter)"/>
  </svg>

  <div class="vignette"></div>
</div>

<div class="player">
  <div class="player-top">
    <div class="art-ring" id="artRing">
      <img id="albumArt" src="" alt="album art">
    </div>
    <div class="track-info">
      <div class="track-title" id="trackTitle">लोड हो रहा है…</div>
      <div class="track-artist" id="trackArtist">—</div>
    </div>
    <button class="shuffle-btn" id="shuffleBtn" title="Shuffle">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="16 3 21 3 21 8"></polyline>
        <line x1="4" y1="20" x2="21" y2="3"></line>
        <polyline points="21 16 21 21 16 21"></polyline>
        <line x1="15" y1="15" x2="21" y2="21"></line>
        <line x1="4" y1="4" x2="9" y2="9"></line>
      </svg>
    </button>
  </div>

  <div class="progress-row">
    <span class="time" id="timeCur">0:00</span>
    <div class="bar-track" id="barTrack"><div class="bar-fill" id="barFill"></div></div>
    <span class="time right" id="timeDur">0:00</span>
  </div>

  <div class="controls-row">
    <button class="ctrl-btn" id="prevBtn" title="Previous">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM20 6L9 12l11 6V6z"/></svg>
    </button>
    <button class="ctrl-btn play-btn" id="playBtn" title="Play/Pause">
      <svg id="playIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="ctrl-btn" id="nextBtn" title="Next">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4 6l11 6L4 18V6z"/></svg>
    </button>
  </div>
</div>

<div id="yt-player-container"></div>

<script>
/* ---------------- Playlist: verified nostalgic Hindi/Bollywood classics ---------------- */
const playlist = [
  { id:"xP2OcqFcKSY", title:"ये शाम मस्तानी", artist:"किशोर कुमार · कटी पतंग (1971)" },
  { id:"seFeZOgyFsc", title:"चुरा लिया है तुमने", artist:"आशा भोसले, मोहम्मद रफ़ी · यादों की बारात (1973)" },
  { id:"L5uidkAi7ck", title:"मेरे सपनों की रानी", artist:"किशोर कुमार · आराधना (1969)" },
  { id:"DFbbpMD3taw", title:"लग जा गले", artist:"लता मंगेशकर · वो कौन थी (1964)" },
  { id:"o7Jnp949e2Y", title:"रूप तेरा मस्ताना", artist:"किशोर कुमार · आराधना (1969)" },
  { id:"5x8HLW0a36g", title:"ये दोस्ती हम नहीं तोड़ेंगे", artist:"किशोर कुमार, मन्ना डे · शोले (1975)" },
  { id:"QwLQ4_gkvsE", title:"पल पल दिल के पास", artist:"किशोर कुमार · ब्लैकमेल (1973)" },
  { id:"I5t894l5b1w", title:"गुलाबी आँखें", artist:"मोहम्मद रफ़ी · द ट्रेन (1970)" },
  { id:"ujLUEhXkxx8", title:"रिमझिम गिरे सावन", artist:"किशोर कुमार · मंज़िल (1979)" },
  { id:"-xcna3K80tA", title:"तेरे बिना ज़िंदगी से", artist:"लता मंगेशकर, किशोर कुमार · आंधी (1975)" },
  { id:"fTauOK8J-U8", title:"एक लड़की को देखा तो ऐसा लगा", artist:"कुमार सानू · 1942: अ लव स्टोरी (1994)" }
];

let currentIndex = 0;
let isShuffle = false;
let ytPlayer = null;
let playerReady = false;
let progressTimer = null;
let pendingAutoplay = false;

const albumArt = document.getElementById('albumArt');
const artRing = document.getElementById('artRing');
const trackTitle = document.getElementById('trackTitle');
const trackArtist = document.getElementById('trackArtist');
const playBtn = document.getElementById('playBtn');
const playIcon = document.getElementById('playIcon');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const shuffleBtn = document.getElementById('shuffleBtn');
const barTrack = document.getElementById('barTrack');
const barFill = document.getElementById('barFill');
const timeCur = document.getElementById('timeCur');
const timeDur = document.getElementById('timeDur');

const ICON_PLAY = '<path d="M8 5v14l11-7z"/>';
const ICON_PAUSE = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';

function fmtTime(s){
  if(!isFinite(s) || s<0) s = 0;
  const m = Math.floor(s/60);
  const sec = Math.floor(s%60).toString().padStart(2,'0');
  return m + ':' + sec;
}

function renderTrackInfo(index){
  const t = playlist[index];
  albumArt.src = `https://img.youtube.com/vi/${t.id}/hqdefault.jpg`;
  trackTitle.textContent = t.title;
  trackArtist.textContent = t.artist;
  barFill.style.width = '0%';
  timeCur.textContent = '0:00';
  timeDur.textContent = '0:00';
}

function loadTrack(index, autoplay){
  currentIndex = (index + playlist.length) % playlist.length;
  renderTrackInfo(currentIndex);
  if(playerReady && ytPlayer){
    if(autoplay){ ytPlayer.loadVideoById(playlist[currentIndex].id); }
    else { ytPlayer.cueVideoById(playlist[currentIndex].id); }
  } else {
    pendingAutoplay = autoplay;
  }
}

function nextIndex(){
  if(isShuffle){
    if(playlist.length === 1) return 0;
    let n;
    do { n = Math.floor(Math.random()*playlist.length); } while(n === currentIndex);
    return n;
  }
  return (currentIndex + 1) % playlist.length;
}
function prevIndexCalc(){
  if(isShuffle){
    if(playlist.length === 1) return 0;
    let n;
    do { n = Math.floor(Math.random()*playlist.length); } while(n === currentIndex);
    return n;
  }
  return (currentIndex - 1 + playlist.length) % playlist.length;
}

function setPlayingUI(playing){
  playIcon.innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
  artRing.classList.toggle('spinning', playing);
  if(playing){ startProgress(); } else { stopProgress(); }
}

function startProgress(){
  stopProgress();
  progressTimer = setInterval(()=>{
    if(!ytPlayer || typeof ytPlayer.getCurrentTime !== 'function') return;
    const cur = ytPlayer.getCurrentTime() || 0;
    const dur = ytPlayer.getDuration() || 0;
    const pct = dur > 0 ? (cur/dur)*100 : 0;
    barFill.style.width = pct + '%';
    timeCur.textContent = fmtTime(cur);
    timeDur.textContent = fmtTime(dur);
  }, 500);
}
function stopProgress(){ if(progressTimer){ clearInterval(progressTimer); progressTimer = null; } }

/* ---------------- YouTube IFrame API ---------------- */
function onYouTubeIframeAPIReady(){
  ytPlayer = new YT.Player('yt-player-container', {
    height:'1', width:'1',
    videoId: playlist[currentIndex].id,
    playerVars:{ autoplay:0, controls:0, disablekb:1, modestbranding:1, rel:0, playsinline:1, fs:0 },
    events:{
      onReady: function(){
        playerReady = true;
        if(pendingAutoplay){ ytPlayer.loadVideoById(playlist[currentIndex].id); pendingAutoplay = false; }
      },
      onStateChange: function(e){
        if(e.data === YT.PlayerState.PLAYING){ setPlayingUI(true); }
        else if(e.data === YT.PlayerState.PAUSED){ setPlayingUI(false); }
        else if(e.data === YT.PlayerState.ENDED){ playIndex(nextIndex()); }
      }
    }
  });
}
window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;
const ytScript = document.createElement('script');
ytScript.src = 'https://www.youtube.com/iframe_api';
document.body.appendChild(ytScript);

function playIndex(idx){
  loadTrack(idx, true);
}

/* ---------------- Controls ---------------- */
playBtn.addEventListener('click', ()=>{
  if(!playerReady || !ytPlayer){ return; }
  const state = ytPlayer.getPlayerState ? ytPlayer.getPlayerState() : -1;
  if(state === YT.PlayerState.PLAYING){ ytPlayer.pauseVideo(); }
  else { ytPlayer.playVideo(); }
});

prevBtn.addEventListener('click', ()=> playIndex(prevIndexCalc()));
nextBtn.addEventListener('click', ()=> playIndex(nextIndex()));

shuffleBtn.addEventListener('click', ()=>{
  isShuffle = !isShuffle;
  shuffleBtn.classList.toggle('active', isShuffle);
});

barTrack.addEventListener('click', (e)=>{
  if(!playerReady || !ytPlayer) return;
  const rect = barTrack.getBoundingClientRect();
  const frac = Math.min(Math.max((e.clientX - rect.left)/rect.width, 0), 1);
  const dur = ytPlayer.getDuration() || 0;
  if(dur > 0){ ytPlayer.seekTo(dur*frac, true); }
});

/* ---------------- Ambient scene generation ---------------- */
function buildLights(){
  const wrap = document.getElementById('lightsWrap');
  const count = 26;
  for(let i=0;i<count;i++){
    const b = document.createElement('div');
    b.className = 'bulb';
    const x = (i/(count-1))*100;
    const sag = Math.sin((i/(count-1))*Math.PI) * 26;
    b.style.left = x + '%';
    b.style.top = (14 + sag) + 'px';
    b.style.animationDelay = (Math.random()*3).toFixed(2) + 's';
    wrap.appendChild(b);
  }
}
function buildParticles(){
  const wrap = document.getElementById('particles');
  const count = 34;
  for(let i=0;i<count;i++){
    const m = document.createElement('div');
    m.className = 'mote';
    const size = 2 + Math.random()*3;
    m.style.width = size+'px';
    m.style.height = size+'px';
    m.style.left = (Math.random()*100)+'%';
    m.style.animationDuration = (10 + Math.random()*14)+'s';
    m.style.animationDelay = (Math.random()*14)+'s';
    wrap.appendChild(m);
  }
}

buildLights();
buildParticles();
renderTrackInfo(currentIndex);
</script>
</body>
</html>
