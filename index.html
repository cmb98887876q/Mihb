<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Sequence</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  body {
    background: #0a0a0a;
    color: #fff;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 20px;
  }

  .container {
    width: 100%;
    max-width: 520px;
  }

  h1 {
    text-align: center;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 8px;
  }

  .subtitle {
    text-align: center;
    color: #aaa;
    font-size: 15px;
    margin-bottom: 36px;
  }

  .upload-box {
    background: #1a1a1a;
    border: 2px dashed #444;
    border-radius: 16px;
    height: 180px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: border-color 0.3s, background 0.3s;
  }

  .upload-box:hover,
  .upload-box.dragover {
    border-color: #888;
    background: #222;
  }

  .upload-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    position: absolute;
    top: 0;
    left: 0;
  }

  .upload-label {
    text-align: center;
    z-index: 1;
    pointer-events: none;
  }

  .upload-label .title {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 6px;
  }

  .upload-label .hint {
    font-size: 14px;
    color: #888;
  }

  .name-label {
    margin: 14px 0 8px 4px;
    font-size: 14px;
    font-weight: 600;
    color: #ccc;
  }

  .name-input {
    width: 100%;
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 12px 16px;
    color: #fff;
    font-size: 15px;
    outline: none;
    margin-bottom: 24px;
  }

  .name-input:focus {
    border-color: #666;
  }

  .controls {
    background: #1a1a1a;
    border-radius: 16px;
    padding: 24px;
    margin-top: 10px;
  }

  .duration-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    font-size: 15px;
    color: #ccc;
  }

  .duration-value {
    font-weight: 600;
    color: #fff;
  }

  input[type="range"] {
    width: 100%;
    height: 6px;
    -webkit-appearance: none;
    background: #333;
    border-radius: 3px;
    outline: none;
    margin-bottom: 28px;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px;
    height: 20px;
    background: #fff;
    border-radius: 50%;
    cursor: pointer;
  }

  .btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s, opacity 0.15s;
  }

  .btn:active {
    transform: scale(0.98);
  }

  .btn-start {
    background: #fff;
    color: #000;
    margin-bottom: 12px;
  }

  .btn-start:hover {
    opacity: 0.9;
  }

  .btn-reset {
    background: #333;
    color: #fff;
  }

  .btn-reset:hover {
    background: #444;
  }

  /* ========== ANIMATION OVERLAY ========== */
  #animationOverlay {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 9999;
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
  }

  #animationOverlay.active {
    display: flex;
  }

  .anim-number {
    font-size: 140px;
    font-weight: 800;
    color: #fff;
    opacity: 0;
    transform: scale(0.4);
    transition: all 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    z-index: 5;
  }

  .anim-number.show {
    opacity: 1;
    transform: scale(1);
  }

  /* YouTube-style 16:9 container */
  .anim-image-container {
    position: relative;
    width: 90%;
    max-width: 960px;
    aspect-ratio: 16 / 9;
    background: #111;
    border-radius: 8px;
    overflow: hidden;
    opacity: 0;
    transform: scale(1.04);
    transition: all 0.7s ease;
    box-shadow: 0 25px 80px rgba(0,0,0,0.7);
  }

  .anim-image-container.show {
    opacity: 1;
    transform: scale(1);
  }

  .anim-image-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Name exactly in the CENTER of the image */
  .anim-name {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    font-size: clamp(32px, 6vw, 64px);
    font-weight: 800;
    color: #fff;
    text-shadow: 0 4px 25px rgba(0,0,0,0.9), 0 0 40px rgba(0,0,0,0.6);
    letter-spacing: 3px;
    text-align: center;
    opacity: 0;
    transition: all 0.5s ease;
    white-space: nowrap;
    pointer-events: none;
    z-index: 2;
  }

  .anim-name.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  .close-btn {
    position: absolute;
    top: 24px;
    right: 24px;
    background: rgba(255,255,255,0.15);
    border: none;
    color: #fff;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    font-size: 22px;
    cursor: pointer;
    z-index: 10;
  }

  .close-btn:hover {
    background: rgba(255,255,255,0.25);
  }
</style>
</head>
<body>

<div class="container">
  <h1>IMAGE SEQUENCE</h1>
  <p class="subtitle">Create a beautiful 2-step presentation</p>

  <!-- IMAGE 1 -->
  <div class="upload-box" id="box1" onclick="document.getElementById('file1').click()">
    <div class="upload-label" id="label1">
      <div class="title">IMAGE 1</div>
      <div class="hint">Click or drag & drop</div>
    </div>
    <img id="preview1" style="display:none;">
    <input type="file" id="file1" accept="image/*" hidden>
  </div>
  <div class="name-label">NAME:-</div>
  <input type="text" class="name-input" id="name1" placeholder="Enter name for Image 1">

  <!-- IMAGE 2 -->
  <div class="upload-box" id="box2" onclick="document.getElementById('file2').click()">
    <div class="upload-label" id="label2">
      <div class="title">IMAGE 2</div>
      <div class="hint">Click or drag & drop</div>
    </div>
    <img id="preview2" style="display:none;">
    <input type="file" id="file2" accept="image/*" hidden>
  </div>
  <div class="name-label">NAME:-</div>
  <input type="text" class="name-input" id="name2" placeholder="Enter name for Image 2">

  <!-- CONTROLS -->
  <div class="controls">
    <div class="duration-row">
      <span>Image Duration</span>
      <span class="duration-value" id="durationValue">4s</span>
    </div>
    <input type="range" id="duration" min="2" max="10" value="4" step="0.5">

    <button class="btn btn-start" onclick="startAnimation()">▶ Start Animation</button>
    <button class="btn btn-reset" onclick="resetAll()">Reset</button>
  </div>
</div>

<!-- ANIMATION OVERLAY -->
<div id="animationOverlay">
  <button class="close-btn" onclick="stopAnimation()">✕</button>
  <div class="anim-number" id="animNumber"></div>
  <div class="anim-image-container" id="animImageBox">
    <img id="animImage" src="">
    <div class="anim-name" id="animName"></div>
  </div>
</div>

<script>
  let img1 = null, img2 = null;
  let isAnimating = false;
  let timeouts = [];

  const durationSlider = document.getElementById('duration');
  const durationValue = document.getElementById('durationValue');
  durationSlider.addEventListener('input', () => {
    durationValue.textContent = durationSlider.value + 's';
  });

  function setupUpload(boxId, fileId, previewId, labelId, setImg) {
    const box = document.getElementById(boxId);
    const fileInput = document.getElementById(fileId);
    const preview = document.getElementById(previewId);
    const label = document.getElementById(labelId);

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) loadImage(file, preview, label, setImg);
    });

    box.addEventListener('dragover', (e) => {
      e.preventDefault();
      box.classList.add('dragover');
    });
    box.addEventListener('dragleave', () => box.classList.remove('dragover'));
    box.addEventListener('drop', (e) => {
      e.preventDefault();
      box.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) {
        loadImage(file, preview, label, setImg);
      }
    });
  }

  function loadImage(file, preview, label, setImg) {
    const reader = new FileReader();
    reader.onload = (e) => {
      preview.src = e.target.result;
      preview.style.display = 'block';
      label.style.display = 'none';
      setImg(e.target.result);
    };
    reader.readAsDataURL(file);
  }

  setupUpload('box1', 'file1', 'preview1', 'label1', (src) => img1 = src);
  setupUpload('box2', 'file2', 'preview2', 'label2', (src) => img2 = src);

  function startAnimation() {
    if (!img1 || !img2) {
      alert('Please upload both images first!');
      return;
    }
    if (isAnimating) return;

    isAnimating = true;
    const duration = parseFloat(durationSlider.value) * 1000;
    const overlay = document.getElementById('animationOverlay');
    const numberEl = document.getElementById('animNumber');
    const imageBox = document.getElementById('animImageBox');
    const imageEl = document.getElementById('animImage');
    const nameEl = document.getElementById('animName');

    overlay.classList.add('active');
    clearTimeouts();

    // Reset
    numberEl.classList.remove('show');
    imageBox.classList.remove('show');
    nameEl.classList.remove('show');

    // 1. Show big number "1"
    numberEl.textContent = '1';
    setTimeout(() => numberEl.classList.add('show'), 40);

    // 2. Hide number → show Image 1 + name in center
    timeouts.push(setTimeout(() => {
      numberEl.classList.remove('show');
      setTimeout(() => {
        imageEl.src = img1;
        nameEl.textContent = document.getElementById('name1').value || 'IMAGE 1';
        imageBox.classList.add('show');
        nameEl.classList.add('show');
      }, 380);
    }, 1100));

    // 3. Hide Image 1 → show number "2"
    timeouts.push(setTimeout(() => {
      imageBox.classList.remove('show');
      nameEl.classList.remove('show');
      setTimeout(() => {
        numberEl.textContent = '2';
        numberEl.classList.add('show');
      }, 450);
    }, 1100 + duration));

    // 4. Hide number → show Image 2 + name in center
    timeouts.push(setTimeout(() => {
      numberEl.classList.remove('show');
      setTimeout(() => {
        imageEl.src = img2;
        nameEl.textContent = document.getElementById('name2').value || 'IMAGE 2';
        imageBox.classList.add('show');
        nameEl.classList.add('show');
      }, 380);
    }, 1100 + duration + 1100));

    // End
    timeouts.push(setTimeout(() => {
      stopAnimation();
    }, 1100 + duration + 1100 + duration + 900));
  }

  function stopAnimation() {
    isAnimating = false;
    clearTimeouts();
    document.getElementById('animationOverlay').classList.remove('active');
  }

  function clearTimeouts() {
    timeouts.forEach(t => clearTimeout(t));
    timeouts = [];
  }

  function resetAll() {
    stopAnimation();
    img1 = img2 = null;
    document.getElementById('preview1').style.display = 'none';
    document.getElementById('preview2').style.display = 'none';
    document.getElementById('label1').style.display = 'block';
    document.getElementById('label2').style.display = 'block';
    document.getElementById('file1').value = '';
    document.getElementById('file2').value = '';
    document.getElementById('name1').value = '';
    document.getElementById('name2').value = '';
    durationSlider.value = 4;
    durationValue.textContent = '4s';
  }
</script>
</body>
</html>
