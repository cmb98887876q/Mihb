<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .top-nav {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 24px;
            box-sizing: border-box;
            z-index: 10;
        }

        .back-arrow {
            text-decoration: none;
            color: #00e5ff;
            font-size: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .back-arrow:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(-4px);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
        }

        .error-container {
            background: rgba(30, 30, 30, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 48px 32px;
            text-align: center;
            max-width: 90%;
            width: 420px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 96px;
            margin: 0;
            color: #00e5ff;
            text-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
            font-weight: 700;
            letter-spacing: -2px;
        }

        .message {
            color: #a0a0a0;
            font-size: 16px;
            line-height: 1.6;
            margin: 24px 0 40px;
        }

        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #00e5ff 0%, #00b3cc 100%);
            color: #000000;
            text-decoration: none;
            padding: 16px 32px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 229, 255, 0.3);
        }

        @media (max-width: 480px) {
            .error-container {
                padding: 40px 24px;
            }
            h1 {
                font-size: 80px;
            }
            .top-nav {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="top-nav">
        <a href="index.htm1" class="back-arrow" aria-label="Go Back">&#8592;</a>
    </div>
    
    <div class="error-container">
        <h1>404</h1>
        <p class="message">Unfortunately, the page you are looking for has been moved or deleted.</p>
        <a href="index.html" class="btn">GO TO HOMEPAGE</a>
    </div>
</body>
</html>
