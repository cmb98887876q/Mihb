<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #030304;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            padding: 24px;
        }

        /* Ambient Background Glow */
        .ambient-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.05) 0%, rgba(0, 0, 0, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 560px;
            width: 100%;
        }

        /* Logo Styling & Animation */
        .logo {
            max-height: 48px;
            width: auto;
            margin-bottom: 40px;
            object-fit: contain;
            opacity: 0;
            animation: logoAnim 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Content Styling */
        .oops-text {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #a1a1aa;
            margin-bottom: 8px;
            opacity: 0;
            animation: oopsAnim 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
        }

        .error-code {
            font-size: 128px;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -4px;
            color: #ffffff;
            margin-bottom: 16px;
            user-select: none;
            opacity: 0;
            display: inline-block;
            animation: codeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards, floatPulse 5s ease-in-out 1.1s infinite;
        }

        .error-title {
            font-size: 24px;
            font-weight: 600;
            color: #f4f4f5;
            margin-bottom: 12px;
            opacity: 0;
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.45s forwards;
        }

        .error-description {
            font-size: 15px;
            line-height: 1.6;
            color: #a1a1aa;
            margin-bottom: 36px;
            max-width: 440px;
            opacity: 0;
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
        }

        /* Premium Button */
        .btn-home {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 32px;
            font-size: 15px;
            font-weight: 600;
            color: #09090b;
            background-color: #ffffff;
            border-radius: 9999px;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 14px rgba(255, 255, 255, 0.1);
            transition: background-color 250ms ease, transform 250ms ease, box-shadow 250ms ease, border-color 250ms ease;
            opacity: 0;
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.75s forwards;
            cursor: pointer;
        }

        .btn-home:hover {
            background-color: #f4f4f5;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.25);
            border-color: #ffffff;
        }

        .btn-home:active {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(255, 255, 255, 0.15);
        }

        /* Animations */
        @keyframes logoAnim {
            0% {
                opacity: 0;
                transform: translateY(-16px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes oopsAnim {
            0% {
                opacity: 0;
                transform: translateY(8px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes codeIn {
            0% {
                opacity: 0;
                transform: scale(0.92);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes floatPulse {
            0%, 100% {
                transform: translateY(0);
                text-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
            }
            50% {
                transform: translateY(-8px);
                text-shadow: 0 0 50px rgba(255, 255, 255, 0.25);
            }
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Mobile Responsiveness */
        @media (max-width: 600px) {
            .logo {
                max-height: 40px;
                margin-bottom: 32px;
            }

            .error-code {
                font-size: 96px;
                letter-spacing: -3px;
            }

            .error-title {
                font-size: 20px;
            }

            .error-description {
                font-size: 14px;
                margin-bottom: 32px;
            }

            .btn-home {
                width: 100%;
                max-width: 280px;
                padding: 14px 24px;
            }

            .ambient-glow {
                width: 300px;
                height: 300px;
            }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <main class="container">
        <!-- Logo -->
        <img src="logo.png" alt="Website Logo" class="logo">

        <!-- Main 404 Section -->
        <span class="oops-text">Oops!</span>
        <h1 class="error-code">404</h1>
        <h2 class="error-title">This page could not be found.</h2>
        <p class="error-description">The page you're looking for may have been moved, deleted, or is temporarily unavailable.</p>

        <!-- Redirect Button -->
        <a href="index.html" class="btn-home">Back to Home</a>
    </main>

</body>
</html>
